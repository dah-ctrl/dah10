<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface2:#eef2f7; --text:#0f172a; --muted:#475569;
  --line:#cbd5e1; --primary:#4338ca; --primary2:#6d28d9; --accent:#0891b2; --good:#15803d;
  --bad:#b91c1c; --warn:#b45309; --primary-soft:#e0e7ff; --good-soft:#dcfce7; --bad-soft:#fee2e2;
  --shadow:0 18px 50px rgba(15,23,42,.10);
  --radius:22px;
}
[data-theme="dark"]{
  --bg:#080d18; --surface:#111827; --surface2:#1b2638; --text:#f8fafc; --muted:#cbd5e1;
  --line:#334155; --primary:#a5b4fc; --primary2:#c4b5fd; --accent:#67e8f9; --good:#4ade80; --bad:#f87171; --warn:#fbbf24;
  --primary-soft:#252d52; --good-soft:#173b2a; --bad-soft:#452127; --shadow:0 18px 50px rgba(0,0,0,.30);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
.app{min-height:100vh}
.hidden{display:none!important}
.screen{min-height:100vh}
.container{width:min(1160px,calc(100% - 32px));margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:.08em;font-size:15px}
.brand span{color:var(--primary)}
.nav-actions{display:flex;gap:8px;flex-wrap:wrap}
.icon-btn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:13px;padding:10px 14px;font-weight:750;transition:.18s transform,.18s box-shadow,.18s background}
.icon-btn:hover,.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(15,23,42,.10)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}
.btn-good{background:var(--good);color:#fff;border-color:transparent}
.btn-danger{background:var(--bad);color:#fff;border-color:transparent}
.btn-ghost{background:transparent}
.btn-lg{padding:14px 20px;font-size:16px;border-radius:15px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:900}
h1,h2,h3{margin:0 0 10px;line-height:1.08}
p{line-height:1.65}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{display:grid;place-items:center;min-height:100vh;padding:32px}
.hero-inner{text-align:center;max-width:760px}

.app-logo{display:block;object-fit:contain}
.hero-logo{width:min(560px,92vw);height:auto;max-height:300px;margin:0 auto 20px;border-radius:28px;filter:drop-shadow(0 22px 35px rgba(15,23,42,.20));}
.topbar-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--text)}
.topbar-logo{width:42px;height:42px;border-radius:12px;object-fit:cover;object-position:center;background:#0b1020;box-shadow:0 6px 18px rgba(15,23,42,.16)}
.setup-logo{width:min(100%,430px);max-height:220px;object-fit:contain;border-radius:22px;margin:0 auto 14px;display:block}
.cert-app-logo{width:150px;max-width:55%;height:auto;display:block;margin:0 auto 12px;object-fit:contain}
@media(max-width:560px){.hero-logo{max-height:220px;border-radius:20px}.topbar-logo{width:36px;height:36px}.brand{font-size:13px}}

.hero-mark{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;margin:0 auto 22px;background:linear-gradient(135deg,#111827,#4f46e5);box-shadow:0 22px 60px rgba(79,70,229,.28);font-size:40px}
.hero-title{font-size:clamp(48px,10vw,100px);font-weight:950;letter-spacing:-.06em}
.hero-title span{color:var(--primary)}
.hero-sub{font-size:clamp(18px,3vw,25px);color:var(--muted);margin:18px 0 28px}
.info-link{margin-top:18px;background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:750}
.setup{padding:56px 0}
.setup-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:22px}
.panel{padding:28px}
.field{display:grid;gap:8px;margin:14px 0}
.field label{font-weight:800;font-size:13px}
input[type=text],input[type=number],select{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 15%,transparent)}
.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.avatar{border:1px solid var(--line);background:var(--surface2);border-radius:15px;padding:12px;text-align:center;font-size:27px}
.avatar.active{border:2px solid var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.preview{display:grid;place-items:center;min-height:260px;background:var(--surface2);border-radius:18px;border:1px dashed var(--line)}
.profile-pic{width:130px;height:130px;border-radius:50%;object-fit:cover;border:5px solid var(--surface);box-shadow:0 12px 30px rgba(15,23,42,.16)}
.app-main{padding:26px 0 70px}
.dashboard-head{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.user-card{display:flex;align-items:center;gap:16px}
.avatar-large{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;background:var(--surface2);font-size:40px;overflow:hidden}
.avatar-large img{width:100%;height:100%;object-fit:cover}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{padding:10px 12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;min-width:88px}
.stat small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:850}
.stat strong{font-size:17px}
.progress{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:inherit;transition:width .35s}
.title-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:900;font-size:12px}
.module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px}
.module{padding:20px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between}
.module .emoji{font-size:28px}
.module h3{margin-top:10px}
.module p{margin:0;color:var(--muted);font-size:14px}
.module .mini{margin-top:14px;font-size:12px;color:var(--primary);font-weight:900}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:34px 0 14px}
.bridge{display:grid;grid-template-columns:220px 1fr;gap:18px}
.step-list{padding:14px}
.step-item{padding:12px;border-radius:14px;color:var(--muted);font-weight:800}
.step-item.active{background:var(--primary-soft);color:var(--primary)}
.step-item.done{color:var(--good)}
.bridge-content{padding:26px}
.context-box{padding:18px;border-left:5px solid var(--primary);background:var(--surface2);border-radius:16px;margin:16px 0}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:15px}
.choice{width:100%;text-align:left;padding:15px;border-radius:15px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:750;min-height:58px;position:relative;z-index:5;pointer-events:auto;cursor:pointer;touch-action:manipulation}
.choice:hover{border-color:var(--primary)}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.feedback{margin-top:14px;padding:14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid var(--line);text-align:center}
th{background:var(--surface2);font-size:12px}
.graph-wrap{background:var(--surface2);border-radius:18px;padding:12px;display:grid;place-items:center}
canvas.graph{width:min(100%,520px);height:auto;border-radius:12px;background:#fff}
.graph-tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.nova{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:start}
.nova-badge{width:92px;height:92px;border-radius:28px;background:linear-gradient(135deg,#0f172a,#06b6d4);display:grid;place-items:center;color:#fff;font-size:38px;box-shadow:0 14px 35px rgba(6,182,212,.25)}
.chat{display:grid;gap:10px}
.bubble{padding:14px 16px;border-radius:17px;background:var(--surface2);border:1px solid var(--line)}

.reward{display:flex;gap:10px;flex-wrap:wrap}
.reward span{padding:10px 12px;border-radius:12px;background:var(--surface2);font-weight:850}
.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}

.badge{padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-weight:800}

.certificate{background:#fff;color:#111827;border:10px solid #d4af37;padding:38px;max-width:900px;margin:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.certificate-inner{border:2px solid #c9a227;padding:32px;text-align:center}

.cert-user-avatar{width:120px;height:120px;border-radius:50%;border:5px solid #d4af37;display:grid;place-items:center;margin:14px auto 8px;background:#f3f4f6;font-size:64px}

.cert-name{font-family:Georgia,serif;font-size:34px;margin:22px 0 8px}
.cert-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
.cert-meta div{padding:10px;border-top:1px solid #d6d3c8}
.qr-box{margin:22px auto 0;display:grid;place-items:center}
#qrCanvas{image-rendering:pixelated;background:#fff;padding:8px;border:1px solid #ddd}
.cert-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.68);z-index:50;display:grid;place-items:center;padding:18px}
.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center}
.list{display:grid;gap:9px;padding-left:18px}
.toast{position:fixed;right:18px;bottom:18px;z-index:70;display:grid;gap:8px;max-width:340px}
.toast-item{padding:13px 15px;border-radius:14px;background:#111827;color:#fff;box-shadow:0 16px 35px rgba(0,0,0,.25);animation:slideIn .25s ease}
@keyframes slideIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;width:9px;height:16px;animation:fall 1.6s linear forwards}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.celebrate{animation:pop .55s ease}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
.judge-steps{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.judge-step{padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.footer-note{margin-top:30px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:900px){.module-grid{grid-template-columns:repeat(2,1fr)}.setup-grid,.bridge{grid-template-columns:1fr}.dashboard-head{grid-template-columns:1fr}.stats{justify-content:flex-start}.nova{grid-template-columns:1fr}.nova-badge{margin:auto}.result-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.container{width:min(100% - 20px,1160px)}.module-grid{grid-template-columns:1fr}.choice-grid,.judge-steps{grid-template-columns:1fr}.avatar-grid{grid-template-columns:repeat(4,1fr)}.panel,.bridge-content,.q-card{padding:18px}.topbar-inner{min-height:58px}.nav-actions .btn{padding:8px 10px;font-size:12px}.certificate{padding:14px;border-width:6px}.certificate-inner{padding:16px}.cert-title{font-size:26px}.cert-name{font-size:25px}.cert-meta{grid-template-columns:1fr}.hero{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media print{
 body{background:#fff!important}.topbar,.cert-actions,.no-print{display:none!important}.certificate{box-shadow:none;border-width:8px;margin:0;width:100%;max-width:none}.certificate-inner{min-height:94vh}
}

/* ==========================================================
   LINEARVERSE 3D LANDING EXPERIENCE
   ========================================================== */
.hero3d{position:relative;min-height:100vh;overflow:hidden;display:grid;place-items:center;padding:34px 22px 42px;background:
 radial-gradient(circle at 50% 18%,rgba(99,102,241,.18),transparent 34%),
 radial-gradient(circle at 12% 70%,rgba(6,182,212,.14),transparent 28%),
 radial-gradient(circle at 88% 68%,rgba(245,158,11,.12),transparent 28%),
 linear-gradient(145deg,#070b1b 0%,#0b1230 48%,#090b18 100%);color:#f8fafc;isolation:isolate;}
.hero3d:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:46px 46px;transform:perspective(700px) rotateX(62deg) translateY(38%);transform-origin:center bottom;opacity:.45;animation:gridDrift 14s linear infinite;z-index:-2;}
.hero3d:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,transparent 28%,rgba(0,0,0,.38) 100%);z-index:-1;pointer-events:none;}
.hero3d-content{position:relative;z-index:3;width:min(1180px,100%);text-align:center;animation:heroEnter .9s cubic-bezier(.2,.8,.2,1) both;}
.hero3d-stars{position:absolute;inset:0;z-index:-1;pointer-events:none;}
.hero3d-stars i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(125,211,252,.9);animation:twinkle var(--d) ease-in-out infinite;animation-delay:calc(var(--i) * -.37s);}
.hero3d-orbit{position:absolute;left:50%;top:40%;border:1px solid rgba(96,165,250,.25);border-radius:50%;transform:translate(-50%,-50%) rotate(-12deg);pointer-events:none;z-index:-1;box-shadow:0 0 35px rgba(59,130,246,.08);}
.orbit-a{width:min(1100px,95vw);height:340px;animation:orbitSpin 18s linear infinite;}
.orbit-b{width:min(880px,80vw);height:250px;transform:translate(-50%,-50%) rotate(32deg);border-color:rgba(168,85,247,.22);animation:orbitSpinReverse 24s linear infinite;}
.hero3d-glow{position:absolute;border-radius:50%;filter:blur(42px);pointer-events:none;z-index:-1;opacity:.5;animation:glowFloat 7s ease-in-out infinite;}
.glow-a{width:240px;height:240px;background:#2563eb;left:4%;top:25%;}.glow-b{width:220px;height:220px;background:#9333ea;right:4%;bottom:20%;animation-delay:-3s;}
.hero3d-badge{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border:1px solid rgba(125,211,252,.25);border-radius:999px;background:rgba(15,23,42,.58);backdrop-filter:blur(14px);font-size:10px;letter-spacing:.13em;font-weight:900;color:#c7d2fe;box-shadow:0 12px 35px rgba(0,0,0,.22);}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulseDot 1.8s infinite;}
.logo-3d-wrap{position:relative;width:min(620px,94vw);margin:12px auto -4px;perspective:1000px;animation:logoFloat 5s ease-in-out infinite;}
.hero3d-logo{width:100%;height:auto;display:block;object-fit:contain;filter:drop-shadow(0 30px 22px rgba(0,0,0,.5)) drop-shadow(0 0 28px rgba(56,189,248,.15));transform:rotateX(2deg);}
.logo-floor{position:absolute;left:12%;right:12%;bottom:-3px;height:34px;border-radius:50%;background:radial-gradient(ellipse,rgba(59,130,246,.42),transparent 68%);filter:blur(8px);animation:floorPulse 3.8s ease-in-out infinite;}
.hero3d-tagline{font-size:clamp(20px,3vw,30px);font-weight:850;letter-spacing:.01em;color:#e2e8f0;text-shadow:0 2px 14px rgba(0,0,0,.4);}
.hero3d-copy{max-width:720px;margin:9px auto 20px;color:#cbd5e1;font-size:clamp(13px,1.6vw,17px);line-height:1.65;}
.hero3d-copy b{color:#f8fafc;}
.bridge-3d{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 23px;perspective:1000px;transform-style:preserve-3d;}
.bridge-node{width:132px;min-height:92px;padding:12px 8px;border-radius:18px;border:1px solid rgba(148,163,184,.25);background:linear-gradient(145deg,rgba(30,41,59,.92),rgba(15,23,42,.72));box-shadow:0 18px 35px rgba(0,0,0,.3),inset 0 1px rgba(255,255,255,.12);display:grid;place-items:center;align-content:center;gap:3px;transform:translateZ(0) rotateX(5deg);transition:.3s transform,.3s border-color,.3s box-shadow;animation:nodeFloat 4.5s ease-in-out infinite;}
.bridge-node:hover{transform:translateY(-10px) rotateX(8deg) rotateY(-5deg) translateZ(18px);border-color:rgba(125,211,252,.6);box-shadow:0 26px 45px rgba(0,0,0,.4),0 0 24px rgba(59,130,246,.16);}
.bridge-node span{font-size:25px;font-weight:900;line-height:1;color:#fff;text-shadow:0 0 15px rgba(125,211,252,.35);}
.bridge-node b{font-size:10px;letter-spacing:.07em;color:#f8fafc;}
.bridge-node small{font-size:9px;color:#94a3b8;}
.n2 span,.n3 span{color:#60a5fa}.n4 span{font-size:16px;color:#fbbf24}.n5 span{font-size:23px}
.bridge-link{position:relative;width:38px;height:3px;background:linear-gradient(90deg,#38bdf8,#a78bfa,#fbbf24);border-radius:99px;box-shadow:0 0 14px rgba(96,165,250,.65);overflow:visible;}
.bridge-link:after{content:"";position:absolute;right:-2px;top:50%;border-left:7px solid #fbbf24;border-top:5px solid transparent;border-bottom:5px solid transparent;transform:translateY(-50%);}
.bridge-link i{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 12px #67e8f9;top:50%;left:-10px;transform:translateY(-50%);animation:travel 1.8s linear infinite;}
.hero3d-actions{display:flex;flex-direction:column;align-items:center;gap:10px;}
.enter-3d{position:relative;display:flex;align-items:center;justify-content:center;gap:26px;min-width:310px;padding:16px 22px;border:1px solid rgba(251,191,36,.65);border-radius:17px;background:linear-gradient(145deg,#f59e0b,#f97316 55%,#c2410c);color:#fff;font-size:17px;font-weight:950;letter-spacing:.06em;box-shadow:0 14px 0 #7c2d12,0 24px 45px rgba(245,158,11,.28),inset 0 1px rgba(255,255,255,.5);cursor:pointer;transition:.16s transform,.16s box-shadow;overflow:hidden;}
.enter-3d:before{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-55%) rotate(8deg);animation:shine 3.2s ease-in-out infinite;}
.enter-3d span,.enter-3d strong{position:relative;z-index:1}.enter-3d strong{font-size:25px;line-height:1;transition:.2s transform;}
.enter-3d:hover{transform:translateY(-4px);box-shadow:0 18px 0 #7c2d12,0 32px 55px rgba(245,158,11,.35),inset 0 1px rgba(255,255,255,.55);}.enter-3d:hover strong{transform:translateX(5px);}.enter-3d:active{transform:translateY(6px);box-shadow:0 6px 0 #7c2d12,0 14px 30px rgba(245,158,11,.2);}
.info-3d{background:transparent;border:0;color:#cbd5e1;text-decoration:underline;text-underline-offset:4px;font-weight:750;cursor:pointer;padding:6px 10px;}
.feature-3d-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:850px;margin:26px auto 0;}
.feature-3d-row>div{padding:12px 10px;border:1px solid rgba(148,163,184,.18);border-radius:15px;background:rgba(15,23,42,.42);backdrop-filter:blur(10px);box-shadow:0 12px 30px rgba(0,0,0,.18);transition:.25s transform,.25s background;}
.feature-3d-row>div:hover{transform:translateY(-5px);background:rgba(30,41,59,.62);}
.feature-3d-row span{display:block;font-size:20px;margin-bottom:4px}.feature-3d-row b{display:block;font-size:10px;letter-spacing:.08em}.feature-3d-row small{display:block;color:#94a3b8;font-size:9px;margin-top:3px;}
.hero3d-footer{color:#94a3b8!important;margin-top:20px;}
.float-chip{position:absolute;z-index:2;padding:9px 13px;border-radius:13px;border:1px solid rgba(125,211,252,.25);background:rgba(15,23,42,.7);backdrop-filter:blur(12px);color:#e0f2fe;font-size:12px;font-weight:900;box-shadow:0 16px 30px rgba(0,0,0,.25);pointer-events:none;}
.chip-graph{left:7%;top:34%;animation:chipFloat 5.5s ease-in-out infinite}.chip-xp{right:8%;top:28%;color:#fde68a;animation:chipFloat 6s ease-in-out infinite -2s}.chip-gem{right:10%;bottom:24%;color:#67e8f9;animation:chipFloat 5s ease-in-out infinite -3.2s;}
@keyframes heroEnter{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
@keyframes gridDrift{from{background-position:0 0,0 0}to{background-position:0 46px,46px 0}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.45)}}
@keyframes orbitSpin{to{transform:translate(-50%,-50%) rotate(348deg)}}
@keyframes orbitSpinReverse{to{transform:translate(-50%,-50%) rotate(-328deg)}}
@keyframes glowFloat{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(15px,-22px,0) scale(1.08)}}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotateZ(0)}50%{transform:translateY(-8px) rotateZ(-.5deg)}}
@keyframes floorPulse{0%,100%{opacity:.55;transform:scaleX(.9)}50%{opacity:1;transform:scaleX(1.08)}}
@keyframes nodeFloat{0%,100%{transform:translateY(0) rotateX(5deg)}50%{transform:translateY(-5px) rotateX(5deg)}}
@keyframes travel{from{left:-10px}to{left:calc(100% + 1px)}}
@keyframes shine{0%,55%{transform:translateX(-65%) rotate(8deg)}75%,100%{transform:translateX(65%) rotate(8deg)}}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes chipFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@media(max-width:900px){.bridge-3d{gap:5px}.bridge-node{width:115px}.bridge-link{width:25px}.chip-graph{left:2%;top:25%}.chip-xp{right:2%;top:20%}.chip-gem{right:3%;bottom:18%}}
@media(max-width:700px){.hero3d{padding:24px 14px 30px}.hero3d-badge{font-size:8px;letter-spacing:.08em}.bridge-3d{display:grid;grid-template-columns:1fr 1fr;max-width:520px;gap:8px}.bridge-link{display:none}.bridge-node{width:auto;min-height:82px}.bridge-node:last-child{grid-column:1/-1;max-width:230px;width:100%;justify-self:center}.feature-3d-row{grid-template-columns:repeat(2,1fr);margin-top:20px}.float-chip{display:none}.hero3d-copy{font-size:12px}.enter-3d{min-width:280px;font-size:15px}}

/* ===== FINAL READABILITY + BRANDING POLISH ===== */

/* Clickable Representation Bridge step navigation */
.step-list .step-item{width:100%;text-align:left;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:9px;min-height:48px;padding:12px 14px;border-radius:12px;transition:border-color .2s,background .2s,transform .2s;}
.step-list .step-item:hover:not(:disabled){border-color:var(--accent);background:var(--soft);transform:translateX(2px);}
.step-list .step-item.active{border-color:var(--accent);background:var(--soft);font-weight:800;}
.step-list .step-item.done{border-color:var(--success);}

.step-check{width:22px;min-width:22px;text-align:center;font-weight:900;color:var(--success);}
.step-lock{margin-left:auto;font-size:13px;}

}

  if(!saved || typeof saved!=="object") return d;
  return {
   ...d,
   ...saved,
   profile:{...d.profile,...(saved.profile&&typeof saved.profile==="object"?saved.profile:{})},
   settings:{...d.settings,...(saved.settings&&typeof saved.settings==="object"?saved.settings:{})},
   badges:Array.isArray(saved.badges)?saved.badges:[],
   completed:Array.isArray(saved.completed)?saved.completed:[],
   dailyDone:saved.dailyDone&&typeof saved.dailyDone==="object"?saved.dailyDone:{}
  };
 }catch(e){ return d; }
}

    {title:"REAL LIFE",eyebrow:"Understand the story first",intro:`A linear relationship can begin with something you already know from everyday life. Imagine this situation:`,box:c.situation,ex:`Look for two important ideas: the amount you already have at the beginning, and the amount that changes for every unit. Here, the starting value is <strong>₱${c.b}</strong> and the rate is <strong>₱${c.m} per ${c.unit}</strong>.`,tip:"Think: What is there at the start? What changes again and again?"},

    {title:"GRAPH",eyebrow:"See the relationship",intro:"A graph turns the numbers into a picture. Each pair from the table becomes a point.",box:`<div class="graph-wrap"><canvas id="bridgeGraph" class="graph" width="520" height="360"></canvas></div>`,ex:`The points <strong>(0, ${c.b})</strong>, <strong>(1, ${c.b+c.m})</strong>, and <strong>(2, ${c.b+2*c.m})</strong> line up. A straight line shows that the relationship changes at a constant rate.`,tip:"The point where the line crosses the y-axis shows the starting value."},
    {title:"EQUATION",eyebrow:"Write the rule",intro:"An equation gives us a compact rule that can describe the whole relationship.",box:`<div class="formula-display">y = ${c.m}x + ${c.b}</div>`,ex:`The form <strong>y = mx + b</strong> is useful because each part has meaning. <strong>m = ${c.m}</strong> is the rate of change, while <strong>b = ${c.b}</strong> is the starting value.`,tip:"Remember: m tells how fast y changes; b tells where the relationship starts."},
    {title:"MEANING",eyebrow:"Connect math back to life",intro:"The goal is not just to read symbols. The goal is to explain what the mathematics means in the real situation.",box:`<div class="meaning-grid"><div><strong>Rate: ₱${c.m}</strong><span>added for every ${c.unit}</span></div><div><strong>Start: ₱${c.b}</strong><span>the amount before any ${c.unit} is added</span></div></div>`,ex:`So <strong>y = ${c.m}x + ${c.b}</strong> means: start with ₱${c.b}, then add ₱${c.m} for every ${c.unit}. The same idea has now been represented as a <strong>real-life situation → table → graph → equation → meaning</strong>.`,tip:"If you can explain the equation in words, you understand the relationship—not just the formula."}
  ];

  document.getElementById("bridgeRoot").innerHTML=pageShell(`<div class="bridge"><div class="card step-list" aria-label="Lesson representations">${steps.map((x,i)=>{const available=i<=step;const cls=`step-item ${i===step?"active":""} ${i<step?"done":""} ${available?"step-clickable":"step-locked"}`;return `<button type="button" class="${cls}" ${available?`onclick="bridgeGoStep(${i})"`:"disabled"} aria-label="${x} lesson"><span class="step-check">${i<step?"✓":""}</span><span>${i+1}. ${x}</span>${!available?'<span class="step-lock">🔒</span>':''}</button>`;}).join("")}</div><div class="card bridge-content">${body}</div></div><div class="footer-note">LEARN THE CONNECTION: ${steps.join(" → ")}</div>`,{nav:false});
  if(step===2)drawBridgeGraph(c);
}

function bridgeChoices(opts,correct,handler){

function bridgeTableChoices(c,ys){
 const good=`<table><tr><th>${c.x}</th>${c.xs.map(x=>`<td>${x}</td>`).join("")}</tr><tr><th>${c.label}</th>${ys.map(y=>`<td>${y}</td>`).join("")}</tr></table>`;
 const wrong1=`<table><tr><th>${c.x}</th>${c.xs.map(x=>`<td>${x}</td>`).join("")}</tr><tr><th>${c.label}</th>${ys.map((y,i)=>`<td>${y+(i===2?5:0)}</td>`).join("")}</tr></table>`;
 const wrong2=`<table><tr><th>${c.x}</th>${c.xs.map(x=>`<td>${x}</td>`).join("")}</tr><tr><th>${c.label}</th>${ys.map(y=>`<td>${y-c.m}</td>`).join("")}</tr></table>`;
 const arr=[good,wrong1,wrong2,`<table><tr><th>${c.x}</th>${c.xs.map(x=>`<td>${x+1}</td>`).join("")}</tr><tr><th>${c.label}</th>${ys.map(y=>`<td>${y}</td>`).join("")}</tr></table>`];

}

function bridgeChoose(group,i){const ok=(group===0?i===0:i===0);if(ok){bridge.answers[group]=true;if(bridge.answers[0]&&bridge.answers[1]){bridge.step=1;unlockBadge("pattern");renderBridge()}else showBridgeRetry("Correct. Now connect the other piece.")}else showBridgeRetry("Think about what the situation says at zero input.")}
function bridgeEquation(i){if(i===0){unlockBadge("equation");bridge.step=4;renderBridge()}else showBridgeRetry("In y = mx + b, m is the rate and b is the starting value.")}
function bridgeMeaning(group,i){const ok=(group===0?i===0:i===1);if(ok){bridge.answers["m"+group]=true;if(bridge.answers.m0&&bridge.answers.m1)finishBridge();else showBridgeRetry("Correct. Now explain the other number.")}else showBridgeRetry("Look back at the situation: which value changes each unit, and which exists before the change begins?")}

function drawBridgeGraph(c){
 const cv=document.getElementById("bridgeGraph");if(!cv)return;const ctx=cv.getContext("2d"),w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
 ctx.strokeStyle="#dbe4ef";ctx.lineWidth=1;
 const ox=55,oy=h-45,sx=80,sy=12;
 for(let x=0;x<=5;x++){let px=ox+x*sx;ctx.beginPath();ctx.moveTo(px,20);ctx.lineTo(px,oy);ctx.stroke();ctx.fillStyle="#64748b";ctx.fillText(x,px-3,oy+18)}
 for(let y=0;y<=Math.min(10,Math.ceil((c.b+4*c.m)/sy));y++){let py=oy-y*sy;ctx.beginPath();ctx.moveTo(40,py);ctx.lineTo(w-18,py);ctx.stroke()}
 ctx.strokeStyle="#111827";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ox,20);ctx.lineTo(ox,oy);ctx.lineTo(w-18,oy);ctx.stroke();
 ctx.fillStyle="#4f46e5";c.xs.forEach(x=>{const y=c.m*x+c.b;if(y/sy<24){let px=ox+x*sx,py=oy-y*sy;ctx.beginPath();ctx.arc(px,py,6,0,Math.PI*2);ctx.fill()}});
}
function plotPoint(x,y,btn){

 else if(x===1&&y===c.b+c.m){btn.classList.add("correct");bridge.answers.g1=true}

}

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];

	getLength : function() {
		return this.num.length;

	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);

			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

		}
	
		return new QRPolynomial(num, 0);

	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );

		}

			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}

QRRSBlock.getRSBlocks = function(typeNumber, errorCorrectLevel) {
	
	var rsBlock = QRRSBlock.getRsBlockTable(typeNumber, errorCorrectLevel);
	
	if (rsBlock === undefined) {
		throw new Error("bad rs block @ typeNumber:" + typeNumber + "/errorCorrectLevel:" + errorCorrectLevel);
	}

	var length = rsBlock.length / 3;
	
	var list = [];
	
	for (var i = 0; i < length; i++) {

		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

		for (var j = 0; j < count; j++) {
			list.push(new QRRSBlock(totalCount, dataCount) );	
		}
	}
	
	return list;
};

QRRSBlock.getRsBlockTable = function(typeNumber, errorCorrectLevel) {

	switch(errorCorrectLevel) {
	case QRErrorCorrectLevel.L :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 0];
	case QRErrorCorrectLevel.M :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 1];
	case QRErrorCorrectLevel.Q :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 2];
	case QRErrorCorrectLevel.H :
		return QRRSBlock.RS_BLOCK_TABLE[(typeNumber - 1) * 4 + 3];
	default :
		return undefined;
	}
};





function QR8bitByte(data) {

}

QR8bitByte.prototype = {

	getLength : function() {
		return this.data.length;
	},
	
	write : function(buffer) {
		for (var i = 0; i < this.data.length; i++) {
			// not JIS ...
			buffer.put(this.data.charCodeAt(i), 8);
		}
	}
};




function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];
}

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);
	},

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};
window.LinearVerseQRCode = QRCode;
