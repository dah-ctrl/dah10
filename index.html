<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain &amp; Range Detective</title>
<style>
/* =========================================================
   DOMAIN & RANGE DETECTIVE — visual system
   Palette: midnight case-room ink + brass badge gold +
            evidence-tag blue (domain) / amber (range)
   Type: Georgia (display, case-file serif) + system sans (UI)
         + Courier New (typewriter / evidence tags)
   ========================================================= */

:root{
  --ink:        #0d1220;
  --ink-2:      #151b2e;
  --ink-3:      #1e2740;
  --panel:      #1a2138;
  --panel-line: #2b3557;
  --paper:      #f4ecd8;
  --paper-2:    #eadfc2;
  --gold:       #d1a54b;
  --gold-bright:#f0c766;
  --domain-blue:#4f8cf0;
  --range-amber:#f0a23d;
  --good:       #4cc98e;
  --bad:        #e2604f;
  --ink-text:   #e9edf7;
  --muted:      #94a1c2;
  --radius:     14px;
  --radius-sm:  8px;
  --shadow:     0 10px 30px rgba(0,0,0,0.45);
  --serif: Georgia, 'Times New Roman', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: 'Courier New', Courier, monospace;
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family: var(--sans);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(209,165,75,0.10), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(79,140,240,0.10), transparent 55%),
    var(--ink);
  color: var(--ink-text);
  min-height:100%;
  -webkit-font-smoothing: antialiased;
}

.hidden{ display:none !important; }

button{ font-family: inherit; cursor:pointer; }
a{ color: var(--gold-bright); }

/* focus visibility for accessibility */
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline: 3px solid var(--gold-bright);
  outline-offset: 2px;
}

/* ---------------- Topbar ---------------- */
.topbar{
  position: sticky; top:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:12px 18px;
  background: rgba(13,18,32,0.92);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--panel-line);
}
.topbar-title{
  font-family: var(--serif); font-weight:700; letter-spacing:0.02em;
  font-size:1.05rem; color: var(--gold-bright);
}
.topbar-right{ display:flex; gap:8px; }
.icon-btn{
  background: var(--panel); color: var(--ink-text);
  border:1px solid var(--panel-line); border-radius: 999px;
  padding:8px 14px; font-size:0.9rem; display:flex; align-items:center; gap:6px;
  transition: transform .15s ease, background .15s ease, border-color .15s ease;
}
.icon-btn:hover{ background: var(--ink-3); border-color: var(--gold); transform: translateY(-1px); }

/* ---------------- Layout helpers ---------------- */
main#app{ max-width: 1100px; margin: 0 auto; padding: 20px 18px 60px; }
.screen{ animation: fadeIn .35s ease; }
@keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

.stack{ display:flex; flex-direction:column; gap:16px; }
.row{ display:flex; gap:12px; flex-wrap:wrap; }
.center{ text-align:center; }
.spacer{ height:8px; }

/* ---------------- Buttons ---------------- */
.btn{
  border:none; border-radius: var(--radius-sm);
  padding: 13px 22px; font-size:1rem; font-weight:600;
  transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
}
.btn:hover{ transform: translateY(-2px); filter: brightness(1.06); }
.btn:active{ transform: translateY(0); }
.btn-primary{ background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color:#231604; box-shadow: 0 6px 18px rgba(209,165,75,0.28); }
.btn-secondary{ background: var(--panel); color: var(--ink-text); border:1px solid var(--panel-line); }
.btn-ghost{ background:transparent; color: var(--muted); border:1px solid var(--panel-line); }
.btn-danger{ background: linear-gradient(135deg,#e2604f,#c0392b); color:#fff; }
.btn-block{ width:100%; }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

/* ---------------- Landing ---------------- */
.landing-hero{
  min-height: 82vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding: 40px 16px; position:relative;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(79,140,240,0.14), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(240,162,61,0.14), transparent 40%);
}
.badge-school{
  font-family: var(--mono); letter-spacing: 0.12em; font-size:0.78rem;
  color: var(--gold-bright); background: rgba(209,165,75,0.1);
  border:1px solid rgba(209,165,75,0.4); border-radius:999px; padding:6px 16px; margin-bottom:22px;
}
.hero-title{
  font-family: var(--serif); font-weight:700; line-height:1.02;
  font-size: clamp(2.6rem, 7vw, 5.2rem); margin:0; letter-spacing: -0.01em;
  background: linear-gradient(135deg, #fff 10%, var(--gold-bright) 60%, var(--domain-blue) 120%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-sub{ font-family: var(--serif); font-style:italic; color: var(--gold-bright); font-size:1.2rem; margin:14px 0 8px; }
.hero-desc{ max-width:560px; color: var(--muted); font-size:1.02rem; line-height:1.6; margin: 6px auto 30px; }
.hero-actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
.hero-chips{ margin-top:40px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:700px; }
.chip{
  font-size:0.82rem; color: var(--ink-text); background: var(--panel);
  border:1px solid var(--panel-line); border-radius:999px; padding:7px 14px;
}

/* case-file corner clip signature element */
.case-tag{
  position:absolute; font-family: var(--mono); font-size:0.7rem; color:var(--muted);
  border:1px dashed var(--panel-line); padding:4px 10px; border-radius:4px; letter-spacing:0.05em;
}
.case-tag.tl{ top:22px; left:22px; }
.case-tag.tr{ top:22px; right:22px; }

/* ---------------- Cards / panels ---------------- */
.card{
  background: var(--panel); border:1px solid var(--panel-line);
  border-radius: var(--radius); padding:22px; box-shadow: var(--shadow);
}
.card-title{ font-family: var(--serif); font-size:1.2rem; color: var(--gold-bright); margin:0 0 6px; }
.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); }
.grid-3{ grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); }
.grid-4{ grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); }

/* ---------------- Profile setup ---------------- */
.profile-card{ max-width:560px; margin: 40px auto; }
.profile-question{ font-family: var(--serif); text-align:center; font-size:1.5rem; color:var(--gold-bright); margin-bottom:4px;}
.profile-input{
  width:100%; padding:14px 16px; font-size:1.05rem; border-radius: var(--radius-sm);
  background: var(--ink-2); border:1px solid var(--panel-line); color: var(--ink-text); margin: 14px 0 20px;
}
.avatar-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:12px; margin-bottom: 22px; }
.avatar-opt{
  font-size:2rem; padding:14px 0; border-radius: var(--radius-sm); text-align:center;
  background: var(--ink-2); border:2px solid var(--panel-line);
  transition: border-color .15s ease, background .15s ease;
}
.avatar-opt.selected, .avatar-opt:hover{ border-color: var(--gold-bright); background: rgba(209,165,75,0.08); }

/* ---------------- Dashboard ---------------- */
.dash-header{
  display:flex; align-items:center; gap:18px; padding:20px; margin-bottom:20px;
  background: linear-gradient(135deg, rgba(79,140,240,0.10), rgba(209,165,75,0.08));
  border:1px solid var(--panel-line); border-radius: var(--radius);
}
.dash-avatar{ font-size:3rem; background: var(--ink-2); border-radius:50%; width:74px; height:74px; display:flex; align-items:center; justify-content:center; border:2px solid var(--gold); flex-shrink:0;}
.dash-name{ font-family: var(--serif); font-size:1.4rem; color:#fff; margin:0;}
.dash-title{ color: var(--gold-bright); font-size:0.85rem; font-family: var(--mono); }
.dash-stats{ display:flex; gap:18px; margin-top:8px; flex-wrap:wrap; }
.stat-pill{ font-size:0.85rem; background: var(--ink-2); border:1px solid var(--panel-line); padding:5px 12px; border-radius:999px; }
.xp-bar-wrap{ flex:1; min-width:180px; }
.xp-bar-track{ background: var(--ink-2); border-radius:999px; height:10px; overflow:hidden; border:1px solid var(--panel-line); }
.xp-bar-fill{ height:100%; background: linear-gradient(90deg, var(--domain-blue), var(--gold-bright)); border-radius:999px; transition: width .5s ease; }
.xp-bar-label{ font-size:0.72rem; color: var(--muted); margin-top:4px; }

.menu-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:14px; }
.menu-tile{
  background: var(--panel); border:1px solid var(--panel-line); border-radius: var(--radius);
  padding:22px 14px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center;
  transition: transform .15s ease, border-color .15s ease;
}
.menu-tile:hover{ transform: translateY(-3px); border-color: var(--gold); }
.menu-tile .emoji{ font-size:2rem; }
.menu-tile .label{ font-weight:600; font-size:0.95rem; }
.menu-tile .desc{ font-size:0.74rem; color: var(--muted); }

/* ---------------- Learn ---------------- */
.learn-card{ max-width:680px; margin:0 auto; }
.learn-progress{ display:flex; gap:6px; margin-bottom:18px; justify-content:center; }
.learn-dot{ width:10px; height:10px; border-radius:50%; background: var(--panel-line); }
.learn-dot.active{ background: var(--gold-bright); }
.learn-dot.done{ background: var(--good); }
.term{ font-family: var(--mono); text-transform:uppercase; letter-spacing:0.1em; font-size:0.8rem; color: var(--gold-bright); }
.term-def{ font-family: var(--serif); font-size:1.5rem; margin:6px 0 14px; }
.example-box{ background: var(--ink-2); border-left:3px solid var(--gold); padding:14px 16px; border-radius: var(--radius-sm); font-family: var(--mono); font-size:0.92rem; white-space:pre-wrap; }

/* ---------------- Session (practice/quiz/assignment/unittest) ---------------- */
.session-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
.case-number{ font-family: var(--mono); color: var(--gold-bright); font-size:0.9rem; letter-spacing:0.06em; }
.diff-badge{ font-size:0.72rem; padding:3px 10px; border-radius:999px; font-weight:700; text-transform:uppercase; }
.diff-easy{ background: rgba(76,201,142,0.15); color: var(--good); }
.diff-average{ background: rgba(240,162,61,0.15); color: var(--range-amber); }
.diff-difficult{ background: rgba(226,96,79,0.15); color: var(--bad); }
.progress-track{ background: var(--ink-2); border-radius:999px; height:6px; overflow:hidden; margin-bottom:20px;}
.progress-fill{ height:100%; background: var(--gold-bright); transition: width .3s ease;}

.question-card{ padding:26px; }
.question-stem{ font-family: var(--serif); font-size:1.3rem; margin: 4px 0 18px; line-height:1.4;}
.rep-display{ margin-bottom:20px; }
.pairs-display{ font-family: var(--mono); font-size:1.15rem; background: var(--ink-2); padding:16px; border-radius: var(--radius-sm); text-align:center; letter-spacing:0.02em;}
table.func-table{ width:100%; border-collapse: collapse; font-family: var(--mono); }
table.func-table th, table.func-table td{ border:1px solid var(--panel-line); padding:10px; text-align:center; }
table.func-table th{ background: var(--ink-2); color: var(--gold-bright); }
.graph-wrap{ background: var(--ink-2); border-radius: var(--radius-sm); padding:12px; text-align:center; }
.graph-wrap svg{ max-width:100%; height:auto; }

.choices{ display:grid; gap:10px; }
.choice-btn{
  text-align:left; background: var(--ink-2); border:1px solid var(--panel-line); border-radius: var(--radius-sm);
  padding:14px 16px; font-family: var(--mono); font-size:0.98rem; color: var(--ink-text);
  display:flex; gap:10px; align-items:center; transition: border-color .15s ease, background .15s ease;
}
.choice-btn .opt-letter{ font-weight:700; color: var(--gold-bright); }
.choice-btn:hover:not(:disabled){ border-color: var(--gold); }
.choice-btn.correct{ border-color: var(--good); background: rgba(76,201,142,0.12); }
.choice-btn.incorrect{ border-color: var(--bad); background: rgba(226,96,79,0.12); }
.choice-btn.reveal-correct{ border-color: var(--good); background: rgba(76,201,142,0.08); }
.choice-btn:disabled{ cursor:default; opacity:0.85; }

.feedback-box{ margin-top:18px; padding:16px 18px; border-radius: var(--radius-sm); }
.feedback-box.correct{ background: rgba(76,201,142,0.10); border:1px solid var(--good); }
.feedback-box.incorrect{ background: rgba(226,96,79,0.10); border:1px solid var(--bad); }
.feedback-head{ font-weight:700; font-size:1.05rem; margin-bottom:6px; }
.feedback-box.correct .feedback-head{ color: var(--good); }
.feedback-box.incorrect .feedback-head{ color: var(--bad); }
.reward-row{ display:flex; gap:10px; margin:8px 0; flex-wrap:wrap; }
.reward-chip{ font-size:0.85rem; background: var(--ink-2); padding:4px 10px; border-radius:999px; border:1px solid var(--panel-line); }

.helper-row{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.hint-box, .tutor-box{
  margin-top:14px; background: var(--ink-2); border-left:3px solid var(--gold); padding:12px 14px; border-radius: var(--radius-sm); font-size:0.94rem;
}
.tutor-box{ border-left-color: var(--domain-blue); }
.tutor-box .tutor-label{ font-weight:700; color: var(--domain-blue); display:block; margin-bottom:4px; }
.hint-box .hint-label{ font-weight:700; color: var(--gold-bright); display:block; margin-bottom:4px; }

/* ---------------- Difficulty select ---------------- */
.diff-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:16px; }
.diff-tile{ padding:26px 16px; text-align:center; border-radius: var(--radius); border:2px solid var(--panel-line); background: var(--panel); }
.diff-tile.easy{ border-color: rgba(76,201,142,0.4); }
.diff-tile.average{ border-color: rgba(240,162,61,0.4); }
.diff-tile.difficult{ border-color: rgba(226,96,79,0.4); }
.diff-tile:hover{ transform: translateY(-3px); }
.diff-tile .emoji{ font-size:2.2rem; }

/* ---------------- Results screen ---------------- */
.results-hero{ text-align:center; padding: 30px 20px; }
.results-score{ font-family: var(--serif); font-size:3.2rem; color: var(--gold-bright); }
.results-grid{ display:grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-top:20px; }
.results-stat{ background: var(--ink-2); border-radius: var(--radius-sm); padding:16px; text-align:center; }
.results-stat .val{ font-size:1.4rem; font-weight:700; color: var(--gold-bright); }
.results-stat .lbl{ font-size:0.78rem; color: var(--muted); margin-top:4px;}

/* ---------------- Games ---------------- */
.chip-target{
  display:inline-flex; align-items:center; gap:6px; font-family: var(--mono); font-size:1.05rem;
  background: var(--ink-2); border:2px solid var(--panel-line); border-radius:999px; padding:9px 18px; margin:5px; transition: all .15s ease;
}
.chip-target.picked{ border-color: var(--gold-bright); background: rgba(209,165,75,0.15); }
.chip-target.locked-correct{ border-color: var(--good); background: rgba(76,201,142,0.15); }
.chip-target.locked-wrong{ border-color: var(--bad); background: rgba(226,96,79,0.15); }

/* ---------------- Progress screen ---------------- */
.mastery-ring-wrap{ display:flex; align-items:center; gap:24px; flex-wrap:wrap; }
.bar-item{ margin-bottom:14px; }
.bar-item .bar-label{ display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:5px; }
.bar-track{ background: var(--ink-2); border-radius:999px; height:10px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:999px; }
.reco-box{ margin-top:10px; background: rgba(209,165,75,0.08); border:1px solid var(--gold); border-radius: var(--radius-sm); padding:14px 16px; font-size:0.92rem; }

/* ---------------- Achievements ---------------- */
.ach-card{ text-align:center; padding:20px 14px; opacity:0.4; filter:grayscale(1); }
.ach-card.unlocked{ opacity:1; filter:none; border-color: var(--gold); }
.ach-icon{ font-size:2.3rem; }

/* ---------------- Certificate ---------------- */
.certificate{
  background: var(--paper); color:#2a2115; border-radius: var(--radius); padding:44px 40px;
  border: 10px double var(--gold); text-align:center; max-width:720px; margin: 0 auto; position:relative;
}
.certificate h1{ font-family: var(--serif); font-size:1.9rem; letter-spacing:0.05em; margin:6px 0; }
.certificate .school{ font-family: var(--mono); letter-spacing:0.15em; font-size:0.85rem; color:#7a5b1f; }
.certificate .cert-name{ font-family: var(--serif); font-size:2.1rem; margin:18px 0 4px; border-bottom:2px solid var(--gold); display:inline-block; padding:0 20px 6px; }
.certificate .cert-competency{ font-style: italic; max-width:520px; margin: 14px auto; line-height:1.5; }
.cert-meta{ display:flex; justify-content:center; gap:26px; margin-top:22px; flex-wrap:wrap; font-family: var(--mono); font-size:0.78rem; color:#5c471c; }
.qr-fallback{ margin: 22px auto 0; width:132px; height:132px; border:2px dashed #7a5b1f; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-direction:column; font-family: var(--mono); font-size:0.62rem; color:#5c471c; padding:8px; text-align:center; }

/* ---------------- Modal ---------------- */
.modal-overlay{
  position:fixed; inset:0; background: rgba(6,8,16,0.72); backdrop-filter: blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-panel{
  background: var(--panel); border:1px solid var(--panel-line); border-radius: var(--radius);
  max-width:560px; width:100%; max-height:84vh; overflow-y:auto; padding:28px; position:relative; box-shadow: var(--shadow);
}
.modal-close{ position:absolute; top:14px; right:16px; background:none; border:none; color: var(--muted); font-size:1.6rem; line-height:1; }
.modal-body h3{ color: var(--gold-bright); font-family: var(--serif); margin: 18px 0 6px; }
.modal-body h3:first-child{ margin-top:0; }
.modal-body p, .modal-body li{ color: var(--ink-text); font-size:0.94rem; line-height:1.55; }

/* ---------------- Achievement toast ---------------- */
.achievement-toast{
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color:#231604;
  padding:14px 24px; border-radius:999px; font-weight:700; box-shadow: var(--shadow);
  z-index:200; animation: toastIn .4s ease;
}
@keyframes toastIn{ from{ opacity:0; transform: translate(-50%, 20px);} to{opacity:1; transform: translate(-50%,0);} }

.confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:150; }

/* ---------------- Misc ---------------- */
.muted{ color: var(--muted); }
.small{ font-size:0.82rem; }
footer.app-footer{ text-align:center; color: var(--muted); font-size:0.78rem; padding: 30px 0; }

@media (max-width: 640px){
  .dash-header{ flex-direction:column; text-align:center; }
  .xp-bar-wrap{ width:100%; }
  .certificate{ padding: 30px 18px; }
}

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>
</head>
<body>

<!-- ============ TOP BAR (hidden on landing) ============ -->
<header id="topbar" class="topbar hidden">
  <button class="icon-btn" id="backBtn" aria-label="Back">&#8592;</button>
  <div class="topbar-title" id="topbarTitle">Dashboard</div>
  <div class="topbar-right">
    <button class="icon-btn" id="infoBtn" aria-label="Information menu">&#9776; Info</button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">&#9881;</button>
  </div>
</header>

<main id="app"></main>

<!-- ============ INFO MODAL ============ -->
<div id="infoModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle">
  <div class="modal-panel">
    <button class="modal-close" data-close="infoModal" aria-label="Close">&times;</button>
    <h2 id="infoModalTitle">🔍 Case File: About This App</h2>
    <div id="infoModalBody" class="modal-body"></div>
  </div>
</div>

<!-- ============ SETTINGS MODAL ============ -->
<div id="settingsModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
  <div class="modal-panel">
    <button class="modal-close" data-close="settingsModal" aria-label="Close">&times;</button>
    <h2 id="settingsModalTitle">⚙ Settings</h2>
    <div id="settingsModalBody" class="modal-body"></div>
  </div>
</div>

<!-- ============ ACHIEVEMENT TOAST ============ -->
<div id="achievementToast" class="achievement-toast hidden"></div>

<!-- ============ CONFETTI CANVAS ============ -->
<canvas id="confettiCanvas" class="confetti-canvas hidden"></canvas>

<script>
/* =========================================================
   DOMAIN & RANGE DETECTIVE
   Vanilla JS single-app engine. No frameworks, no network.
   ========================================================= */

(function(){
"use strict";

/* ===================== CONSTANTS ===================== */
const STORAGE_KEY = "drd_state_v1";

const LEVELS = [
  {level:1,  xp:0},
  {level:2,  xp:100},
  {level:3,  xp:250},
  {level:4,  xp:450},
  {level:5,  xp:700},
  {level:6,  xp:1000},
  {level:7,  xp:1400},
  {level:8,  xp:1800},
  {level:9,  xp:2300},
  {level:10, xp:3000},
];

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // shallow-merge with fresh defaults so new fields don't break old saves
      state = Object.assign(freshState(), parsed);
      state.stats = Object.assign(freshState().stats, parsed.stats || {});
      state.competency = parsed.competency || JSON.parse(JSON.stringify(DEFAULT_COMPETENCY));
      return;
    }
  }catch(e){ /* localStorage unavailable or corrupt — fall back gracefully */ }
  state = freshState();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    console.warn("Could not save progress (LocalStorage unavailable).", e);
  }
}

/* ===================== UTILITIES ===================== */
function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
function el(tag, attrs, children){
  const node = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === "class") node.className = attrs[k];
    else if(k === "html") node.innerHTML = attrs[k];
    else if(k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(c=>{ if(c) node.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return node;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[randInt(0,arr.length-1)]; }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = randInt(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function setToStr(vals){ return "{" + vals.join(", ") + "}"; }
function fmtDate(d){
  return d.toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"});
}
function pct(n,d){ return d>0 ? Math.round((n/d)*100) : 0; }

/* ===================== LEVEL / XP ===================== */
function levelForXp(xp){
  let lvl = 1;
  for(const row of LEVELS){ if(xp >= row.xp) lvl = row.level; }
  return lvl;
}
function xpForNextLevel(level){
  const row = LEVELS.find(r=>r.level === level+1);
  return row ? row.xp : null;
}
function awardRewards(xp, coins, gems){
  state.xp += xp; state.coins += coins; state.gems += gems || 0;
  const newLevel = levelForXp(state.xp);
  const leveledUp = newLevel > state.level;
  state.level = newLevel;
  saveState();
  return leveledUp;
}

/* ===================== QUESTION ENGINE ===================== */
// Build a small verified function dataset for a given difficulty.
function makeFunctionData(difficulty){
  let n, xMin, xMax, yMin, yMax, allowRepeatY;
  if(difficulty === "easy"){ n = 3; xMin=1; xMax=9; yMin=1; yMax=9; allowRepeatY=false; }
  else if(difficulty === "average"){ n = 4; xMin=-6; xMax=9; yMin=-9; yMax=12; allowRepeatY=true; }
  else { n = 5; xMin=-10; xMax=10; yMin=-15; yMax=15; allowRepeatY=true; }

  const xs = [];
  while(xs.length < n){
    const x = randInt(xMin, xMax);
    if(!xs.includes(x)) xs.push(x);
  }
  xs.sort((a,b)=>a-b);

  const pairs = xs.map(x => [x, randInt(yMin, yMax)]);

  if(allowRepeatY && pairs.length > 2 && Math.random() < 0.55){
    const idx = randInt(1, pairs.length-1);
    pairs[idx][1] = pairs[0][1]; // repeated output — valid for a function
  }
  return pairs; // array of [x,y], sorted by x, unique x
}

function domainOf(data){ return data.map(p=>p[0]); }
function rangeOf(data){ return [...new Set(data.map(p=>p[1]))]; }

const DOMAIN_STEMS = [
  "What is the domain of the function?",
  "Which set represents the domain (input values)?",
  "Identify the domain shown by the function.",
  "Which values are the inputs of the function?",
];
const RANGE_STEMS = [
  "What is the range of the function?",
  "Which set represents the range (output values)?",
  "Identify the range shown by the function.",
  "Which values are the outputs of the function?",
];
const REP_LABEL = { pairs:"ordered pairs", table:"table", graph:"graph" };

function buildDistractorSets(correct, opposite, allValuesPool){
  const sets = [];
  // 1: the opposite set (classic domain/range reversal)
  sets.push(opposite);
  // 2: a shuffled mash-up of domain+range values, same size as correct
  let mix = shuffle([...new Set(allValuesPool)]).slice(0, correct.length);
  if(mix.length < correct.length) mix = mix.concat(correct.slice(0, correct.length-mix.length));
  sets.push(mix);
  // 3: correct set but with one value altered (off-by-one trap)
  const altered = correct.slice();
  altered[0] = altered[0] + (Math.random()<0.5 ? 1 : -1);
  sets.push(altered);

  // de-duplicate against each other and against the correct set (as strings)
  const seen = new Set([setToStr(correct)]);
  const finalSets = [];
  for(const s of sets){
    const str = setToStr(s);
    if(!seen.has(str)){ seen.add(str); finalSets.push(s); }
  }
  // fallback: if collisions removed too many, generate random tweaks
  while(finalSets.length < 3){
    const tweak = correct.map(v => v + randInt(-2,2));
    const str = setToStr(tweak);
    if(!seen.has(str)){ seen.add(str); finalSets.push(tweak); }
  }
  return finalSets.slice(0,3);
}

let questionCounter = 0;
function buildQuestion(difficulty, representation, forcedFocus){
  const data = makeFunctionData(difficulty);
  const domain = domainOf(data);
  const range = rangeOf(data);
  const focus = forcedFocus || (Math.random() < 0.5 ? "domain" : "range");
  const correct = focus === "domain" ? domain : range;
  const opposite = focus === "domain" ? range : domain;
  const distractors = buildDistractorSets(correct, opposite, [...domain, ...range]);

  const stemPool = focus === "domain" ? DOMAIN_STEMS : RANGE_STEMS;
  let stem = pick(stemPool);
  if(representation === "table") stem = "Based on the table, " + stem[0].toLowerCase() + stem.slice(1);
  if(representation === "graph") stem = "Based on the graph, " + stem[0].toLowerCase() + stem.slice(1);

  const choiceSets = shuffle([correct, ...distractors]);
  const letters = ["A","B","C","D"];
  const choices = choiceSets.map((set,i)=>({
    id: letters[i],
    label: setToStr(set),
    isCorrect: setToStr(set) === setToStr(correct),
  }));

  questionCounter++;
  return {
    qid: "q" + questionCounter + "_" + Date.now() + "_" + randInt(0,9999),
    difficulty, representation, focus, data, domain, range,
    stem, choices,
    correctLabel: setToStr(correct),
  };
}

function buildQuestionSet(count, difficultyPlan, repPlan){
  // difficultyPlan / repPlan: arrays of length `count` (already shuffled by caller)
  const seen = new Set();
  const questions = [];
  let guard = 0;
  while(questions.length < count && guard < count*30){
    guard++;
    const diff = difficultyPlan[questions.length];
    const rep = repPlan[questions.length];
    const q = buildQuestion(diff, rep);
    if(seen.has(q.correctLabel + q.representation + q.focus)){ continue; }
    seen.add(q.correctLabel + q.representation + q.focus);
    questions.push(q);
  }
  return questions;
}

function planFor(type, difficulty){
  const reps = ["pairs","table","graph"];
  if(type === "practice"){
    const diffPlan = new Array(15).fill(difficulty);
    const repPlan = shuffle([...reps,...reps,...reps,...reps,...reps]).slice(0,15);
    return {diffPlan, repPlan};
  }
  // quiz / assignment / unit test: mixed difficulty & representation
  const diffPlan = shuffle([
    ..."easy easy easy easy easy".split(" "),
    ..."average average average average average".split(" "),
    ..."difficult difficult difficult difficult difficult".split(" "),
  ]);
  const repPlan = shuffle([
    ..."pairs pairs pairs pairs pairs".split(" "),
    ..."table table table table table".split(" "),
    ..."graph graph graph graph graph".split(" "),
  ]);
  return {diffPlan, repPlan};
}

/* ===================== HINTS ===================== */
function getHints(q){
  const focusWord = q.focus === "domain" ? "domain" : "range";
  const ioWord = q.focus === "domain" ? "inputs" : "outputs";
  let repHint;
  if(q.representation === "pairs"){
    repHint = q.focus === "domain"
      ? "Look at the first number in each ordered pair."
      : "Look at the second number in each ordered pair.";
  } else if(q.representation === "table"){
    repHint = q.focus === "domain"
      ? "Look at the x-row (top row) of the table."
      : "Look at the y-row (bottom row) of the table.";
  } else {
    repHint = q.focus === "domain"
      ? "Look at the x-axis (horizontal) position of every point."
      : "Look at the y-axis (vertical) position of every point.";
  }
  const correctVals = q.focus === "domain" ? q.domain : q.range;
  const masked = correctVals.map((v,i)=> i === Math.floor(correctVals.length/2) ? "?" : v);
  const strongHint = `The correct set has ${correctVals.length} value(s): ${setToStr(masked)} — figure out the missing one.`;
  return [
    `The ${focusWord} refers to the ${ioWord} of the function.`,
    repHint,
    strongHint,
  ];
}

/* ===================== OFFLINE TUTOR ===================== */
// getTutorHelp(question, studentChoiceLabel, hintLevel) -> string
function getTutorHelp(q, studentChoiceLabel, hintLevel){
  const oppositeFocus = q.focus === "domain" ? "range" : "domain";
  const oppositeVals = q.focus === "domain" ? q.range : q.domain;
  const correctVals = q.focus === "domain" ? q.domain : q.range;

  // Mistake 1: domain/range reversed
  if(studentChoiceLabel === setToStr(oppositeVals)){
    const base = `Nice attempt! Those values are the ${oppositeFocus === "domain" ? "inputs" : "outputs"}. `
      + `The ${q.focus} contains the ${q.focus === "domain" ? "input" : "output"} values.`;
    if(hintLevel <= 1) return base + " Try reading the question again — which set is being asked for?";
    if(hintLevel === 2){
      const repClue = q.representation === "pairs"
        ? (q.focus === "domain" ? " Look at the first number in each ordered pair." : " Look at the second number in each ordered pair.")
        : q.representation === "table"
        ? (q.focus === "domain" ? " Look at the top row of the table." : " Look at the bottom row of the table.")
        : (q.focus === "domain" ? " Look at the x-axis position of each point." : " Look at the y-axis position of each point.");
      return base + repClue;
    }
    return base + ` The ${q.focus} you're looking for is ${setToStr(correctVals)}.`;
  }

  // Mistake 2/3: coordinate order confusion — chosen set matches correct values but reversed order
  const reversedCorrect = correctVals.slice().reverse();
  if(studentChoiceLabel === setToStr(reversedCorrect) && reversedCorrect.length > 1){
    return `You have the right values, but in the wrong order! In this competency we list ${q.focus} values in the order they appear (often smallest to largest, or the order given). Re-check the order and try again.`;
  }

  // Mistake 4/5: generic mixed-up / table or graph axis confusion — fallback
  const genericByLevel = [
    `Not quite! Remember: ${q.focus === "domain" ? "domain = inputs (x-values)" : "range = outputs (y-values)"}. Look carefully at the ${q.representation === "graph" ? "axis" : q.representation === "table" ? "row" : "coordinate position"} that matches that.`,
    `Here's a closer clue: in a ${REP_LABEL[q.representation]}, the ${q.focus} comes from ${q.representation === "pairs" ? (q.focus==="domain"?"the first number of every pair":"the second number of every pair") : q.representation === "table" ? (q.focus==="domain"?"the top row":"the bottom row") : (q.focus==="domain"?"the x-axis (horizontal)":"the y-axis (vertical)")}.`,
    `You're close — the correct ${q.focus} is ${setToStr(correctVals)}. Compare that carefully with what you selected to see exactly where the mix-up happened.`,
  ];
  return genericByLevel[Math.min(hintLevel-1, genericByLevel.length-1)] || genericByLevel[0];
}

/* ===================== SVG GRAPH ===================== */
function renderGraphSVG(data){
  const xs = data.map(p=>p[0]), ys = data.map(p=>p[1]);
  const xMin = Math.min(0,...xs) - 1, xMax = Math.max(0,...xs) + 1;
  const yMin = Math.min(0,...ys) - 1, yMax = Math.max(0,...ys) + 1;
  const W = 340, H = 260, pad = 30;
  const sx = v => pad + ( (v - xMin) / (xMax - xMin) ) * (W - 2*pad);
  const sy = v => H - pad - ( (v - yMin) / (yMax - yMin) ) * (H - 2*pad);

  let grid = "";
  for(let gx = Math.ceil(xMin); gx <= Math.floor(xMax); gx++){
    grid += `<line x1="${sx(gx)}" y1="${pad}" x2="${sx(gx)}" y2="${H-pad}" stroke="#2b3557" stroke-width="0.6"/>`;
  }
  for(let gy = Math.ceil(yMin); gy <= Math.floor(yMax); gy++){
    grid += `<line x1="${pad}" y1="${sy(gy)}" x2="${W-pad}" y2="${sy(gy)}" stroke="#2b3557" stroke-width="0.6"/>`;
  }

  const axisX = `<line x1="${pad}" y1="${sy(0)}" x2="${W-pad}" y2="${sy(0)}" stroke="#94a1c2" stroke-width="1.4"/>`;
  const axisY = `<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${H-pad}" stroke="#94a1c2" stroke-width="1.4"/>`;

  let points = "";
  data.forEach(([x,y])=>{
    points += `<circle cx="${sx(x)}" cy="${sy(y)}" r="5" fill="#f0c766" stroke="#0d1220" stroke-width="1.5"/>`;
    points += `<text x="${sx(x)+8}" y="${sy(y)-8}" font-size="10" fill="#e9edf7" font-family="Courier New, monospace">(${x},${y})</text>`;
  });

  const labelX = `<text x="${W-pad+4}" y="${sy(0)+4}" font-size="11" fill="#94a1c2">x</text>`;
  const labelY = `<text x="${sx(0)-4}" y="${pad-6}" font-size="11" fill="#94a1c2" text-anchor="end">y</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of the function points">
    ${grid}${axisX}${axisY}${points}${labelX}${labelY}
  </svg>`;
}

/* ===================== REPRESENTATION RENDER ===================== */
function renderRepresentation(q){
  const wrap = el("div", {class:"rep-display"});
  if(q.representation === "pairs"){
    const str = "{" + q.data.map(([x,y])=>`(${x}, ${y})`).join(", ") + "}";
    wrap.appendChild(el("div", {class:"pairs-display"}, [str]));
  } else if(q.representation === "table"){
    const table = el("table", {class:"func-table"});
    const xRow = el("tr", null, [el("th",null,["x"]), ...q.data.map(([x])=>el("td",null,[String(x)]))]);
    const yRow = el("tr", null, [el("th",null,["y"]), ...q.data.map(([,y])=>el("td",null,[String(y)]))]);
    table.appendChild(xRow); table.appendChild(yRow);
    wrap.appendChild(table);
  } else {
    const graphWrap = el("div", {class:"graph-wrap", html: renderGraphSVG(q.data)});
    wrap.appendChild(graphWrap);
  }
  return wrap;
}

/* ===================== ACHIEVEMENTS / TITLES / MASTERY ===================== */
function currentTitle(){
  let title = TITLE_LADDER[0].name;
  for(const row of TITLE_LADDER){ if(state.achievements.length >= row.min) title = row.name; }
  return title;
}
function unlockAchievement(id){
  if(!state.achievements.includes(id)){
    state.achievements.push(id);
    saveState();
    const def = ACHIEVEMENT_DEFS.find(a=>a.id===id);
    if(def) showAchievementToast(def);
    return true;
  }
  return false;
}
function checkAchievements(sessionSummary){
  const newly = [];
  if(state.activitiesCompleted >= 1 && unlockAchievement("first_case")) newly.push("first_case");
  if(state.stats.correct >= 10 && unlockAchievement("clue_collector")) newly.push("clue_collector");
  if(state.stats.domain.attempted >= 10 && pct(state.stats.domain.correct, state.stats.domain.attempted) >= 80 && unlockAchievement("domain_decoder")) newly.push("domain_decoder");
  if(state.stats.range.attempted >= 10 && pct(state.stats.range.correct, state.stats.range.attempted) >= 80 && unlockAchievement("range_ranger")) newly.push("range_ranger");
  if(sessionSummary && sessionSummary.score === 15 && unlockAchievement("perfect_investigator")) newly.push("perfect_investigator");
  if(state.learnCompleted && state.unitTestBestScore >= 12 && unlockAchievement("master_detective")) newly.push("master_detective");
  if(state.achievements.includes("master_detective")) grantCertificateIfNeeded();
  return newly;
}
function grantCertificateIfNeeded(){
  if(!state.certificateEarned){
    state.certificateEarned = true;
    state.certificateId = "DRD-" + Date.now().toString(36).toUpperCase();
    saveState();
  }
}
function masteryPct(){ return pct(state.stats.correct, state.stats.attempted); }

/* ===================== CONFETTI ===================== */
function fireConfetti(){
  const canvas = $("#confettiCanvas");
  canvas.classList.remove("hidden");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const colors = ["#f0c766","#d1a54b","#4f8cf0","#4cc98e","#e2604f"];
  const pieces = Array.from({length:120}, ()=>({
    x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.3,
    r: 4+Math.random()*5, c: pick(colors), vy: 2+Math.random()*3, vx: -1.5+Math.random()*3,
    rot: Math.random()*360, vr: -6+Math.random()*12,
  }));
  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);
      ctx.restore();
    });
    if(frame < 150){ requestAnimationFrame(tick); }
    else{ ctx.clearRect(0,0,canvas.width,canvas.height); canvas.classList.add("hidden"); }
  }
  tick();
}

/* ===================== VOICE ===================== */
function speak(text){
  if(!state.settings.voiceEnabled) return;
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.98; utter.pitch = 1.02;
    const voices = window.speechSynthesis.getVoices();
    const enUS = voices.find(v=>/en-US|en_US/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(enUS) utter.voice = enUS;
    window.speechSynthesis.speak(utter);
  }catch(e){ /* voice unavailable — fail silently */ }
}
function voiceButton(text){
  if(!("speechSynthesis" in window)) return null;
  return el("button", {class:"btn btn-ghost", "aria-label":"Listen", onclick:()=>speak(text)}, ["🔊 Listen"]);
}

/* ===================== ROUTER ===================== */
let route = "landing";
let routeParams = {};
const backStack = [];

function goTo(newRoute, params, pushBack){
  if(pushBack !== false){ backStack.push({route, params: routeParams}); }
  route = newRoute; routeParams = params || {};
  render();
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
}
function goBack(){
  const prev = backStack.pop();
  if(prev){ route = prev.route; routeParams = prev.params; render(); }
  else { goTo("dashboard", {}, false); }
}

/* ===================== SESSION ENGINE ===================== */
let session = null;

function startSession(type, difficulty){
  const {diffPlan, repPlan} = planFor(type, difficulty);
  const questions = buildQuestionSet(15, diffPlan, repPlan);
  session = {
    type, questions, index:0,
    scoreFirstTry:0,
    xp:0, coins:0, gems:0,
    domain:{a:0,c:0}, range:{a:0,c:0},
    rep:{pairs:{a:0,c:0}, table:{a:0,c:0}, graph:{a:0,c:0}},
    perQuestion: questions.map(()=>({attempted:false, firstCorrect:null, hintLevel:0, solved:false, tutorMsg:null, hintMsg:null, selected:null})),
  };
}

function renderSessionScreen(root){
  if(!session || routeParams.freshStart){
    startSession(routeParams.type, routeParams.difficulty);
  }
  const i = session.index;
  const q = session.questions[i];
  const qs = session.perQuestion[i];

  const meta = el("div", {class:"session-meta"});
  const label = { practice:"PRACTICE", quiz:"QUIZ", assignment:"ASSIGNMENT", unittest:"UNIT TEST" }[session.type];
  meta.appendChild(el("div", {class:"case-number"}, [`${label} · CASE #${String(i+1).padStart(2,"0")} / 15`]));
  meta.appendChild(el("span", {class:"diff-badge diff-"+q.difficulty}, [q.difficulty]));
  root.appendChild(meta);

  const track = el("div", {class:"progress-track"});
  track.appendChild(el("div", {class:"progress-fill", style:`width:${((i)/15)*100}%`}));
  root.appendChild(track);

  const card = el("div", {class:"card question-card"});
  card.appendChild(el("div", {class:"muted small"}, [`Representation: ${REP_LABEL[q.representation]}`]));
  card.appendChild(el("div", {class:"question-stem"}, [q.stem]));
  card.appendChild(renderRepresentation(q));

  const choicesWrap = el("div", {class:"choices"});
  q.choices.forEach(choice=>{
    const btn = el("button", {class:"choice-btn", "data-id":choice.id, onclick:()=>handleAnswer(choice, btn, q, qs, choicesWrap, card)}, [
      el("span",{class:"opt-letter"},[choice.id + "."]), el("span",null,[choice.label])
    ]);
    if(qs.attempted && qs.solved){
      btn.disabled = true;
      if(choice.isCorrect) btn.classList.add("correct");
      else if(qs.selected === choice.id) btn.classList.add("incorrect");
    }
    choicesWrap.appendChild(btn);
  });
  card.appendChild(choicesWrap);

  const feedbackHolder = el("div", {class:"feedback-holder"});
  card.appendChild(feedbackHolder);
  if(qs.attempted){
    renderFeedback(feedbackHolder, q, qs, card);
  }

  const helperRow = el("div", {class:"helper-row"});
  helperRow.appendChild(el("button", {class:"btn btn-secondary", onclick:()=>showHint(q, qs, card)}, ["💡 Hint (" + (3-qs.hintLevel) + " left)"]));
  const vb = voiceButton(q.stem);
  if(vb) helperRow.appendChild(vb);
  card.appendChild(helperRow);

  const hintHolder = el("div", {class:"hint-holder"});
  card.appendChild(hintHolder);
  if(qs.hintMsg){ hintHolder.appendChild(el("div",{class:"hint-box"},[el("span",{class:"hint-label"},["💡 Hint"]), qs.hintMsg])); }

  root.appendChild(card);
}

function showHint(q, qs, card){
  const hints = getHints(q);
  if(qs.hintLevel < 3){
    qs.hintMsg = hints[qs.hintLevel];
    qs.hintLevel++;
    render();
  }
}

function handleAnswer(choice, btnEl, q, qs, choicesWrap, card){
  if(qs.solved) return;
  const isFirstAttempt = !qs.attempted;
  qs.attempted = true;
  qs.selected = choice.id;

  $all(".choice-btn", choicesWrap).forEach(b=>b.disabled = true);

  if(choice.isCorrect){
    qs.solved = true;
    if(isFirstAttempt){
      qs.firstCorrect = true;
      session.scoreFirstTry++;
    }
    trackStats(q, isFirstAttempt, true);
    const gemBonus = Math.random() < 0.25;
    const xp = 20, coins = 5, gems = gemBonus ? 1 : 0;
    session.xp += xp; session.coins += coins; session.gems += gems;
    btnEl.classList.add("correct");
  } else {
    if(isFirstAttempt){
      qs.firstCorrect = false;
      trackStats(q, true, false);
    }
    btnEl.classList.add("incorrect");
    // re-enable so they can try again (never locked)
    $all(".choice-btn", choicesWrap).forEach(b=> b.disabled = false);
  }
  render();
}

function trackStats(q, isFirstAttempt, wasCorrect){
  if(!isFirstAttempt) return;
  state.stats.attempted++;
  if(wasCorrect) state.stats.correct++;
  state.stats[q.focus].attempted++;
  if(wasCorrect) state.stats[q.focus].correct++;
  state.stats.rep[q.representation].attempted++;
  if(wasCorrect) state.stats.rep[q.representation].correct++;

  session[q.focus].a++;
  if(wasCorrect) session[q.focus].c++;
  session.rep[q.representation].a++;
  if(wasCorrect) session.rep[q.representation].c++;
  saveState();
}

function renderFeedback(holder, q, qs, card){
  holder.innerHTML = "";
  if(qs.solved){
    const box = el("div", {class:"feedback-box correct"});
    box.appendChild(el("div", {class:"feedback-head"}, ["✅ CASE SOLVED!"]));
    if(qs.firstCorrect){
      const rewardRow = el("div", {class:"reward-row"});
      rewardRow.appendChild(el("span",{class:"reward-chip"},["+20 XP"]));
      rewardRow.appendChild(el("span",{class:"reward-chip"},["+5 🪙"]));
      box.appendChild(rewardRow);
    }
    box.appendChild(el("p", null, [`The ${q.focus} is ${q.correctLabel}. ` +
      (q.representation==="pairs" ? `Each ordered pair is (x, y) — the ${q.focus==="domain"?"x-values form the domain":"y-values form the range"}.`
      : q.representation==="table" ? `In the table, ${q.focus==="domain"?"the top row (x) is the domain":"the bottom row (y) is the range"}.`
      : `On the graph, ${q.focus==="domain"?"the domain is read from the x-axis":"the range is read from the y-axis"}.`)
    ]));
    holder.appendChild(box);
    const nextBtn = el("button", {class:"btn btn-primary btn-block", style:"margin-top:16px;", onclick: advanceSession}, [session.index < 14 ? "Continue →" : "See Results →"]);
    holder.appendChild(nextBtn);
  } else if(qs.attempted){
    const box = el("div", {class:"feedback-box incorrect"});
    box.appendChild(el("div", {class:"feedback-head"}, ["🔎 KEEP INVESTIGATING"]));
    const oppositeVals = q.focus==="domain" ? q.range : q.domain;
    const chosenChoice = q.choices.find(c=>c.id===qs.selected);
    let mistakeMsg = "That's not quite it — take another look.";
    if(chosenChoice && chosenChoice.label === setToStr(oppositeVals)){
      mistakeMsg = `You selected the ${q.focus==="domain"?"range":"domain"}. The ${q.focus} contains the ${q.focus==="domain"?"input":"output"} values.`;
    }
    box.appendChild(el("p", null, [mistakeMsg]));
    holder.appendChild(box);

    const helperRow2 = el("div", {class:"row", style:"margin-top:10px;"});
    helperRow2.appendChild(el("button", {class:"btn btn-secondary", onclick:()=>{
      qs.tutorMsg = getTutorHelp(q, chosenChoice ? chosenChoice.label : "", qs.hintLevel+1);
      render();
    }}, ["🤖 Ask the Tutor"]));
    helperRow2.appendChild(el("button", {class:"btn btn-ghost", onclick:()=>{ qs.attempted=false; qs.selected=null; render(); }}, ["🔁 Try Again"]));
    helperRow2.appendChild(el("button", {class:"btn btn-primary", onclick: advanceSession}, ["➡ Continue"]));
    holder.appendChild(helperRow2);

    if(qs.tutorMsg){
      holder.appendChild(el("div",{class:"tutor-box"},[el("span",{class:"tutor-label"},["🤖 Offline Tutor"]), qs.tutorMsg]));
    }
  }
}

function advanceSession(){
  if(session.index < 14){
    session.index++;
    render();
  } else {
    finishSession();
  }
}

function finishSession(){
  const score = session.scoreFirstTry;
  const perfect = score === 15;
  let bonusXp=0, bonusCoins=0, bonusGems=0;
  if(perfect){ bonusXp=100; bonusCoins=100; bonusGems=25; }
  const leveledUp = awardRewards(session.xp+bonusXp, session.coins+bonusCoins, session.gems+bonusGems);

  state.activitiesCompleted++;
  if(session.type === "unittest"){
    state.unitTestBestScore = Math.max(state.unitTestBestScore, score);
  }
  saveState();

  const summary = {score, perfect, bonusXp, bonusCoins, bonusGems,
    xp: session.xp+bonusXp, coins: session.coins+bonusCoins, gems: session.gems+bonusGems,
    domain: session.domain, range: session.range, rep: session.rep, type: session.type};
  const newAch = checkAchievements(summary);
  routeParams = {summary, leveledUp, newAch};
  route = "results";
  session = null;
  render();
  if(perfect) fireConfetti();
}

let hunterGame = null;
function startHunterRound(mode){
  const difficulty = pick(["easy","average"]);
  const data = makeFunctionData(difficulty);
  const domain = domainOf(data);
  const range = rangeOf(data);
  const target = mode === "domain" ? domain : range;
  const decoys = shuffle([...new Set([...domain,...range])].filter(v=>!target.includes(v))).slice(0,3);
  const candidates = shuffle([...target, ...decoys]);
  return {data, domain, range, target, candidates, picked:[], submitted:false};
}
function renderHunterGame(root, mode){
  if(!hunterGame || routeParams.freshStart || hunterGame.mode !== mode){
    hunterGame = {mode, round:1, totalRounds:5, correctRounds:0, xp:0, coins:0, gems:0, ...startHunterRound(mode)};
  }
  const g = hunterGame;
  root.appendChild(el("div", {class:"session-meta"}, [
    el("div",{class:"case-number"},[`${mode.toUpperCase()} HUNTER · ROUND ${g.round} / ${g.totalRounds}`])
  ]));
  const card = el("div", {class:"card"});
  card.appendChild(el("p", null, [`Tap every value that belongs to the ${mode}.`]));
  card.appendChild(renderRepresentation({representation: Math.random()<0.5?"pairs":"table", data: g.data}));

  const chipsWrap = el("div", {class:"center", style:"margin-top:18px;"});
  g.candidates.forEach(v=>{
    const isPicked = g.picked.includes(v);
    let cls = "chip-target" + (isPicked ? " picked" : "");
    if(g.submitted){
      const isTarget = g.target.includes(v);
      if(isPicked && isTarget) cls = "chip-target locked-correct";
      else if(isPicked && !isTarget) cls = "chip-target locked-wrong";
      else if(!isPicked && isTarget) cls = "chip-target locked-correct";
    }
    const chip = el("button", {class:cls, disabled: g.submitted, onclick:()=>{
      if(g.picked.includes(v)) g.picked = g.picked.filter(x=>x!==v);
      else g.picked.push(v);
      render();
    }}, [String(v)]);
    chipsWrap.appendChild(chip);
  });
  card.appendChild(chipsWrap);

  if(!g.submitted){
    card.appendChild(el("button", {class:"btn btn-primary btn-block", style:"margin-top:18px;", onclick:()=>{
      g.submitted = true;
      const correct = setToStr(g.picked.slice().sort((a,b)=>a-b)) === setToStr(g.target.slice().sort((a,b)=>a-b));
      if(correct){
        g.correctRounds++;
        g.xp += 20; g.coins += 5; if(Math.random()<0.3) g.gems += 1;
      }
      render();
    }}, ["Submit"]));
  } else {
    const correct = setToStr(g.picked.slice().sort((a,b)=>a-b)) === setToStr(g.target.slice().sort((a,b)=>a-b));
    const fb = el("div", {class:"feedback-box " + (correct?"correct":"incorrect"), style:"margin-top:16px;"});
    fb.appendChild(el("div",{class:"feedback-head"},[correct ? "✅ CASE SOLVED!" : "🔎 KEEP INVESTIGATING"]));
    fb.appendChild(el("p",null,[`The ${mode} is ${setToStr(g.target)}.`]));
    card.appendChild(fb);
    card.appendChild(el("button", {class:"btn btn-primary btn-block", style:"margin-top:14px;", onclick:()=>{
      if(g.round < g.totalRounds){
        const fresh = startHunterRound(mode);
        Object.assign(hunterGame, fresh, {round: g.round+1});
        render();
      } else {
        const leveledUp = awardRewards(g.xp, g.coins, g.gems);
        state.activitiesCompleted++;
        saveState();
        const newAch = checkAchievements();
        const perfect = g.correctRounds === g.totalRounds;
        routeParams = {summary:{score: g.correctRounds*3, perfect:false, xp:g.xp, coins:g.coins, gems:g.gems, type:"game"}, leveledUp, newAch};
        hunterGame = null;
        route = "results";
        render();
        if(perfect) fireConfetti();
      }
    }}, [g.round < g.totalRounds ? "Next Round →" : "Finish Game"]));
  }
  root.appendChild(card);
}

/* ===================== PROGRESS ===================== */
function renderProgress(root){
  const s = state.stats;
  const card = el("div", {class:"card"});
  card.appendChild(el("div", {class:"card-title"}, ["🧠 Case Mastery"]));

  const bars = [
    {label:"Mastery", val: masteryPct(), color:"var(--gold-bright)"},
    {label:"Domain accuracy", val: pct(s.domain.correct,s.domain.attempted), color:"var(--domain-blue)"},
    {label:"Range accuracy", val: pct(s.range.correct,s.range.attempted), color:"var(--range-amber)"},
    {label:"Ordered pairs", val: pct(s.rep.pairs.correct,s.rep.pairs.attempted), color:"var(--good)"},
    {label:"Tables", val: pct(s.rep.table.correct,s.rep.table.attempted), color:"var(--good)"},
    {label:"Graphs", val: pct(s.rep.graph.correct,s.rep.graph.attempted), color:"var(--good)"},
  ];
  bars.forEach(b=>{
    const item = el("div", {class:"bar-item"});
    item.appendChild(el("div", {class:"bar-label"}, [el("span",null,[b.label]), el("span",null,[b.val+"%"])]));
    const track = el("div",{class:"bar-track"});
    track.appendChild(el("div",{class:"bar-fill", style:`width:${b.val}%; background:${b.color};`}));
    item.appendChild(track);
    card.appendChild(item);
  });

  card.appendChild(el("div", {class:"grid grid-3", style:"margin-top:18px;"}, [
    el("div",{class:"results-stat"},[el("div",{class:"val"},[String(s.attempted)]), el("div",{class:"lbl"},["Questions Attempted"])]),
    el("div",{class:"results-stat"},[el("div",{class:"val"},[String(s.correct)]), el("div",{class:"lbl"},["Correct Answers"])]),
    el("div",{class:"results-stat"},[el("div",{class:"val"},[String(s.attempted-s.correct)]), el("div",{class:"lbl"},["Incorrect Answers"])]),
  ]));

  // simple recommendation: weakest area
  const areas = [
    {name:"Domain Cases", val: pct(s.domain.correct,s.domain.attempted), n:s.domain.attempted},
    {name:"Range Cases", val: pct(s.range.correct,s.range.attempted), n:s.range.attempted},
    {name:"Graph Cases", val: pct(s.rep.graph.correct,s.rep.graph.attempted), n:s.rep.graph.attempted},
    {name:"Table Cases", val: pct(s.rep.table.correct,s.rep.table.attempted), n:s.rep.table.attempted},
    {name:"Ordered Pair Cases", val: pct(s.rep.pairs.correct,s.rep.pairs.attempted), n:s.rep.pairs.attempted},
  ].filter(a=>a.n>0);
  if(areas.length){
    areas.sort((a,b)=>a.val-b.val);
    card.appendChild(el("div", {class:"reco-box"}, [`📌 Recommended: Practice ${areas[0].name} — currently ${areas[0].val}% accuracy.`]));
  } else {
    card.appendChild(el("div", {class:"reco-box"}, ["📌 Start a Practice session to build your first case history!"]));
  }
  root.appendChild(card);
}

/* ===================== ACHIEVEMENTS ===================== */
function renderAchievements(root){

      el("div",{class:"ach-icon"},[a.icon]),
      el("div",{style:"font-weight:700;margin-top:8px;"},[a.name]),
      el("div",{class:"muted small",style:"margin-top:4px;"},[a.desc]),
      el("div",{class:"small",style:"margin-top:6px;color:"+(unlocked?"var(--good)":"var(--muted)")+";"},[unlocked?"UNLOCKED":"LOCKED"]),
    ]));
  });
  root.appendChild(grid);
  root.appendChild(el("p", {class:"muted small", style:"margin-top:16px;"}, ["Current title: " + currentTitle()]));
}

    card.appendChild(el("p", {class:"muted"}, ["Complete the Learning Path and score 12+/15 on the Unit Test to earn your Certificate of Mathematical Mastery."]));

  const cert = el("div", {class:"certificate"}, [
    el("div", {class:"school"}, ["LOOC NATIONAL HIGH SCHOOL"]),
    el("h1", null, ["CERTIFICATE OF MATHEMATICAL MASTERY"]),
    el("p", null, ["This certifies that"]),
    el("div", {class:"cert-name"}, [state.username]),
    el("p", null, ["has demonstrated achievement in:"]),
    el("p", {class:"cert-competency"}, ["“" + state.competency.title + "”"]),
    el("div", {class:"cert-meta"}, [
      el("span",null,["Best Unit Test Score: " + state.unitTestBestScore + "/15"]),
      el("span",null,["Mastery: " + masteryPct() + "%"]),
      el("span",null,["Date: " + today]),
      el("span",null,["Certificate ID: " + state.certificateId]),
    ]),
    el("div", {class:"qr-fallback"}, [
      "QR VERIFICATION",
      el("div",{style:"font-size:0.58rem;margin-top:4px;"},[state.certificateId]),
      el("div",{class:"small", style:"margin-top:4px;"},["(offline fallback — no scanner library available; present this Certificate ID for manual verification)"])
    ]),
  ]);
  root.appendChild(cert);
  const actions = el("div", {class:"row center", style:"justify-content:center; margin-top:20px;"});
  actions.appendChild(el("button", {class:"btn btn-primary", onclick:()=>window.print()}, ["⬇ DOWNLOAD / PRINT CERTIFICATE"]));
  actions.appendChild(el("button", {class:"btn btn-secondary", onclick:()=>goTo("dashboard",{},false)}, ["Back to Dashboard"]));
  root.appendChild(actions);
}

/* ===================== SETTINGS MODAL ===================== */
function openSettingsModal(){
  const body = $("#settingsModalBody");
  body.innerHTML = "";

  body.appendChild(el("h3", null, ["⚙ Edit Competency"]));
  const titleInput = el("input", {class:"profile-input", value: state.competency.title});
  const descInput = el("textarea", {class:"profile-input", rows:"2", style:"resize:vertical;"}, [state.competency.description]);
  const objInput = el("textarea", {class:"profile-input", rows:"2", style:"resize:vertical;"}, [state.competency.objective]);
  body.appendChild(el("label", {class:"small muted"}, ["Competency title"]));
  body.appendChild(titleInput);
  body.appendChild(el("label", {class:"small muted"}, ["Description"]));
  body.appendChild(descInput);
  body.appendChild(el("label", {class:"small muted"}, ["Learning objective"]));
  body.appendChild(objInput);
  body.appendChild(el("button", {class:"btn btn-primary btn-block", onclick:()=>{
    state.competency.title = titleInput.value.trim() || DEFAULT_COMPETENCY.title;
    state.competency.description = descInput.value.trim();
    state.competency.objective = objInput.value.trim();
    saveState();
    closeModal("settingsModal");
  }}, ["Save Competency"]));

  body.appendChild(el("h3", null, ["🔊 Voice"]));
  const voiceLabel = el("label", {class:"row", style:"align-items:center; gap:10px;"});
  const voiceCheckbox = el("input", {type:"checkbox"});
  voiceCheckbox.checked = state.settings.voiceEnabled;
  voiceCheckbox.addEventListener("change", ()=>{ state.settings.voiceEnabled = voiceCheckbox.checked; saveState(); });
  voiceLabel.appendChild(voiceCheckbox);
  voiceLabel.appendChild(document.createTextNode("Enable spoken hints & explanations"));
  body.appendChild(voiceLabel);

  body.appendChild(el("h3", null, ["⚠ Reset Progress"]));
  body.appendChild(el("p", {class:"muted small"}, ["This clears XP, coins, gems, achievements, and stats. Your competency edits are kept."]));
  body.appendChild(el("button", {class:"btn btn-danger btn-block", onclick:()=>{
    if(confirm("Reset all progress? This cannot be undone.")){
      const keepCompetency = state.competency;
      state = freshState();
      state.competency = keepCompetency;
      state.profileSet = false;
      saveState();
      closeModal("settingsModal");
      backStack.length = 0;
      goTo("landing", {}, false);
    }
  }}, ["Reset Progress"]));

  $("#settingsModal").classList.remove("hidden");
}
function closeModal(id){ $("#"+id).classList.add("hidden"); }

/* ===================== EVENT WIRING ===================== */
function wireGlobalEvents(){
  $("#backBtn").addEventListener("click", goBack);
  $("#infoBtn").addEventListener("click", ()=>openInfoModal());
  $("#settingsBtn").addEventListener("click", ()=>openSettingsModal());
  $all("[data-close]").forEach(b=> b.addEventListener("click", (e)=> closeModal(e.currentTarget.dataset.close)));
  $all(".modal-overlay").forEach(m=> m.addEventListener("click", (e)=>{ if(e.target === m) m.classList.add("hidden"); }));
  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape"){ $all(".modal-overlay").forEach(m=>m.classList.add("hidden")); }
  });
  if("speechSynthesis" in window){
    window.speechSynthesis.onvoiceschanged = ()=>{ /* voices load async — no action needed */ };
  }
}

/* ===================== INIT ===================== */
function init(){
  loadState();
  wireGlobalEvents();
  route = state.profileSet ? "dashboard" : "landing";
  render();
}
document.addEventListener("DOMContentLoaded", init);

})();

</script>
