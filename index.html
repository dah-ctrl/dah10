<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINEARIX — See the Pattern. Model Reality. Master Mathematics.</title>
<style>
:root{
  --bg:#0F1729;
  --bg-grid:#16213B;
  --surface:#182238;
  --surface-2:#1F2C48;
  --line:#2A3A5C;
  --text:#EAF0FB;
  --text-dim:#93A2C2;
  --mint:#5EEAD4;
  --mint-dim:#1F5C52;
  --amber:#FBBF24;
  --pink:#F472B6;
  --sky:#60A5FA;
  --red:#F87171;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,0.35);
  --font-display:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(180deg, rgba(15,23,41,0.0) 0%, rgba(15,23,41,0.6) 100%),
    repeating-linear-gradient(0deg, var(--bg-grid) 0 1px, transparent 1px 44px),
    repeating-linear-gradient(90deg, var(--bg-grid) 0 1px, transparent 1px 44px),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0 0 8px 0; letter-spacing:-0.01em;}
p{line-height:1.5; color:var(--text-dim);}
button{font-family:var(--font-body); cursor:pointer;}
a{color:var(--mint);}
.hidden{display:none !important;}
#app{max-width:1100px;margin:0 auto;padding:16px 16px 90px;}

/* ---------- BUTTONS ---------- */
.btn{
  border:none;border-radius:999px;padding:14px 26px;font-size:15px;font-weight:600;
  background:var(--surface-2);color:var(--text);border:1px solid var(--line);
  transition:transform .15s ease, background .15s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:linear-gradient(135deg,var(--mint),#34D399);color:#04241C;box-shadow:0 8px 22px rgba(94,234,212,0.25);}
.btn-amber{background:linear-gradient(135deg,var(--amber),#F59E0B);color:#3B2600;}
.btn-pink{background:linear-gradient(135deg,var(--pink),#EC4899);color:#3B0B24;}
.btn-ghost{background:transparent;border:1px solid var(--line);}
.btn-sm{padding:9px 16px;font-size:13px;}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}

/* ---------- CARDS ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;}
.card + .card{margin-top:16px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}

/* ---------- LANDING ---------- */
#screen-landing{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;}
.brand-mark{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.axis-icon{width:46px;height:46px;}
.brand-title{font-size:56px;font-weight:700;background:linear-gradient(135deg,var(--mint),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-tag{color:var(--text-dim);font-size:16px;margin-bottom:34px;letter-spacing:.02em;}
.info-btn{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center;}
.identity-card{width:min(440px,92vw);}
.avatar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0 4px;}
.avatar-opt{font-size:26px;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);}
.avatar-opt.selected{border-color:var(--mint);background:var(--mint-dim);}
.text-input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;margin-top:6px;}
.offline-pill{position:fixed;bottom:14px;left:14px;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:12px;color:var(--mint);display:flex;align-items:center;gap:6px;z-index:40;}
.offline-dot{width:8px;height:8px;border-radius:50%;background:var(--mint);}

/* ---------- MODAL ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(5,9,20,0.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;position:relative;}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);font-size:20px;}

/* ---------- NAV ---------- */
#topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;position:sticky;top:0;background:rgba(15,23,41,0.92);backdrop-filter:blur(6px);z-index:30;margin-bottom:10px;}
.tb-left{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;}
.tb-stats{display:flex;gap:10px;font-size:13px;flex-wrap:wrap;}
.stat-chip{background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;}
#navbar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px;}
.nav-btn{white-space:nowrap;background:transparent;border:1px solid transparent;color:var(--text-dim);padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:600;}
.nav-btn.active{background:var(--surface-2);color:var(--text);border-color:var(--line);}

/* ---------- DASHBOARD ---------- */
.welcome-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.avatar-big{font-size:52px;width:88px;height:88px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;border:2px solid var(--mint);}
.progress-track{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:999px;transition:width .5s ease;}
.tile{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-sm);padding:16px;cursor:pointer;transition:transform .15s ease,border-color .15s;}
.tile:hover{transform:translateY(-3px);border-color:var(--mint);}
.tile h4{margin-bottom:4px;}
.tile-emoji{font-size:26px;margin-bottom:8px;}

/* ---------- QUESTIONS ---------- */
.q-context{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sky);font-weight:700;margin-bottom:6px;}
.q-prompt{font-size:18px;margin-bottom:16px;}
.choice{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:12px;margin-bottom:10px;font-size:14.5px;}
.choice:hover{border-color:var(--sky);}
.choice.correct{background:var(--mint-dim);border-color:var(--mint);}
.choice.wrong{background:#4A2027;border-color:var(--red);}
.choice[disabled]{cursor:default;}
.feedback-box{margin-top:14px;padding:14px 16px;border-radius:12px;font-size:14.5px;}
.feedback-box.good{background:var(--mint-dim);border:1px solid var(--mint);}
.feedback-box.bad{background:#3A1E24;border:1px solid var(--red);}
.progress-dots{display:flex;gap:6px;margin-bottom:14px;}
.p-dot{width:22px;height:6px;border-radius:4px;background:var(--surface-2);}
.p-dot.done{background:var(--mint);}
.p-dot.now{background:var(--sky);}

/* table & graph */
table.rep-table{width:100%;border-collapse:collapse;margin:10px 0;}
table.rep-table th,table.rep-table td{border:1px solid var(--line);padding:8px 10px;text-align:center;font-size:14px;}
table.rep-table th{background:var(--surface-2);}
.graph-wrap{background:#0B1220;border:1px solid var(--line);border-radius:12px;padding:8px;}
.slider-row{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px;}
.slider-row input[type=range]{flex:1;}
.slider-val{width:64px;text-align:right;font-weight:700;color:var(--mint);}

/* achievements/badges */
.badge{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;}
.badge.locked{opacity:.4;}
.badge-emoji{font-size:26px;}

/* AI tutor */
#tutor-fab{position:fixed;bottom:18px;right:18px;background:linear-gradient(135deg,var(--pink),#EC4899);border:none;color:#fff;padding:14px 18px;border-radius:999px;font-weight:700;box-shadow:0 10px 24px rgba(244,114,182,.35);z-index:41;}
#tutor-panel{position:fixed;bottom:82px;right:18px;width:min(360px,92vw);max-height:70vh;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;z-index:42;box-shadow:var(--shadow);}
.tutor-head{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.tutor-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:42vh;}
.tmsg{padding:10px 12px;border-radius:12px;font-size:13.5px;max-width:85%;}
.tmsg.bot{background:var(--surface-2);align-self:flex-start;}
.tmsg.user{background:var(--mint-dim);align-self:flex-end;}
.tutor-input{display:flex;border-top:1px solid var(--line);padding:10px;gap:8px;}
.tutor-input input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 14px;color:var(--text);}
.tutor-quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
.qchip{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim);padding:5px 10px;border-radius:999px;}

/* toasts / effects */
#toast-layer{position:fixed;top:14px;right:14px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--surface);border:1px solid var(--mint);padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:toastin .3s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.confetti{position:fixed;top:-10px;width:8px;height:8px;z-index:150;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:0.2;}}

/* certificate */
.certificate{background:#fdfaf1;color:#1a2540;border:10px solid #d4a938;border-radius:8px;padding:38px;text-align:center;position:relative;}
.certificate h2{color:#1a2540;font-size:30px;}
.cert-logo{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:10px;}
.cert-name{font-family:var(--font-display);font-size:32px;margin:14px 0;color:#0F1729;}
.cert-meta{font-size:12px;color:#555;margin-top:18px;}
#qr-holder{margin:16px auto 0;width:120px;height:120px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #ccc;}

/* editor */
textarea.text-input{min-height:90px;resize:vertical;font-family:var(--font-body);}

/* misc */
.pill{display:inline-block;background:var(--surface-2);border:1px solid var(--line);padding:4px 10px;border-radius:999px;font-size:12px;color:var(--text-dim);}
.mt8{margin-top:8px;}.mt16{margin-top:16px;}.mt24{margin-top:24px;}
.center{text-align:center;}
.small{font-size:12.5px;color:var(--text-dim);}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
</style>
</head>

<div id="toast-layer"></div>
<div class="offline-pill" id="offlinePill"><span class="offline-dot"></span><span id="offlineText">OFFLINE MODE</span></div>

<!-- ================= LANDING ================= -->
<div id="screen-landing">
  <button class="info-btn" onclick="openInfoModal()">ℹ️</button>
  <div class="brand-mark">
    <svg class="axis-icon" viewBox="0 0 100 100"><line x1="10" y1="90" x2="10" y2="10" stroke="#5EEAD4" stroke-width="4"/><line x1="10" y1="90" x2="90" y2="90" stroke="#5EEAD4" stroke-width="4"/><line x1="14" y1="76" x2="80" y2="20" stroke="#60A5FA" stroke-width="5" stroke-linecap="round"/><circle cx="80" cy="20" r="6" fill="#F472B6"/></svg>
  </div>
  <div class="brand-title">LINEARIX</div>
  <div class="brand-tag">See the Pattern. Model Reality. Master Mathematics.</div>

  <div class="card identity-card">
    <h3>👤 Choose Your Identity</h3>
    <input class="text-input" id="usernameInput" placeholder="Enter your name" maxlength="18">
    <div class="avatar-grid" id="avatarGrid"></div>
    <div class="btn-row" style="justify-content:center;">
      <button class="btn btn-primary" onclick="startLearning()">🚀 START LEARNING</button>
    </div>
    <p class="small mt8" id="landingError" style="color:var(--red);"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <div id="topbar">
    <div class="tb-left"><span id="tbAvatar">🦊</span> LINEARIX</div>
    <div class="tb-stats">
      <span class="stat-chip">Lv <span id="tbLevel">1</span></span>
      <span class="stat-chip">⭐ <span id="tbXp">0</span> XP</span>
      <span class="stat-chip">💎 <span id="tbGems">0</span></span>
    </div>
  </div>
  <div id="navbar"></div>
  <div id="viewport"></div>
</div>

<button id="tutor-fab" onclick="toggleTutor()">🤖 Ask Math Coach</button>
<div id="tutor-panel" class="hidden">
  <div class="tutor-head"><strong>🤖 Math Coach</strong><button class="modal-close" style="position:static;" onclick="toggleTutor()">✕</button></div>
  <div class="tutor-msgs" id="tutorMsgs"></div>
  <div class="tutor-quick" id="tutorQuick"></div>
  <div class="tutor-input">
    <input id="tutorInput" placeholder="Ask about slope, tables, graphs..." onkeydown="if(event.key==='Enter')sendTutorMsg()">
    <button class="btn btn-sm btn-pink" onclick="sendTutorMsg()">Send</button>
  </div>
</div>

<div id="modalLayer"></div>

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    STATE = raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  }catch(e){ STATE = defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }catch(e){ console.warn('save failed',e); }
}

/* ---------------- UI UTIL ---------------- */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function $(sel){ return document.querySelector(sel); }
function toast(msg){
  const t=el(`<div class="toast">${msg}</div>`);
  $('#toast-layer').appendChild(t);
  setTimeout(()=>t.remove(),3200);
}
function confettiBurst(n=40){
  const colors=['#5EEAD4','#FBBF24','#F472B6','#60A5FA'];
  for(let i=0;i<n;i++){
    const c=el(`<div class="confetti"></div>`);
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3200);
  }
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function speak(text){
  if(STATE.muted) return;
  try{
    if('speechSynthesis' in window){
      const u = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      const en = voices.find(v=>/en-US|en_US|English/i.test(v.lang+v.name));
      if(en) u.voice = en;
      u.rate=1; speechSynthesis.speak(u);
    }
  }catch(e){}
}

/* ---------------- XP / LEVEL / GEMS ---------------- */
function levelFromXp(xp){
  let cur=LEVELS[0];
  for(const l of LEVELS){ if(xp>=l.xp) cur=l; }
  return cur;
}
function addXp(amount){
  const before=levelFromXp(STATE.xp);
  STATE.xp+=amount;
  const after=levelFromXp(STATE.xp);
  STATE.level=after.lvl;
  if(!STATE.unlockedTitles.includes(after.name)) STATE.unlockedTitles.push(after.name);
  saveState();
  toast(`⭐ +${amount} XP`);
  if(after.lvl>before.lvl){
    confettiBurst(60);
    toast(`🎉 Level Up! You are now Level ${after.lvl} — ${after.name}`);
    speak(`Congratulations! You leveled up to ${after.name}`);
  }
}
function addGems(amount){ STATE.gems+=amount; saveState(); toast(`💎 +${amount} Gems`); }
function unlockAchievement(id){
  if(STATE.achievements.includes(id)) return;

/* ---------------- QUESTION GENERATOR ---------------- */
function pickContext(){ return CONTEXTS[randInt(0,CONTEXTS.length-1)]; }
function genLine(){
  const m = randInt(2,25);
  const b = randInt(5,120);
  return {m,b};
}
function buildTable(ctx,m,b,points){
  points = points || [0,1,2,3];
  return points.map(x=>({x, y: m*x+b}));
}
// core validator: ensures table & equation correspond
function validateLine(m,b,table){
  return table.every(pt => pt.y === m*pt.x+b);
}

function questionSignature(q){ return q.type+'|'+q.ctxId+'|'+q.m+'|'+q.b; }
function isRecentlyUsed(sig){ return STATE.recentQuestionSigs.includes(sig); }
function markUsed(sig){
  STATE.recentQuestionSigs.push(sig);
  if(STATE.recentQuestionSigs.length>12) STATE.recentQuestionSigs.shift();
  saveState();
}

// Build one question of a given skill "type" (verbal2table, table2graph, graph2equation, equation2meaning, realworld2model)
function generateQuestion(type){
  let tries=0, q=null;
  while(tries<8){
    tries++;
    const ctx=pickContext();
    const {m,b}=genLine();
    const table=buildTable(ctx,m,b);
    if(!validateLine(m,b,table)) continue;
    const sig = type+'|'+ctx.id+'|'+m+'|'+b;
    if(isRecentlyUsed(sig)) continue;
    q = buildQuestionOfType(type,ctx,m,b,table);
    q.ctxId=ctx.id; q.sig=sig;
    markUsed(sig);
    break;
  }
  if(!q){ // fallback if all tries collided (rare)
    const ctx=pickContext(); const {m,b}=genLine(); const table=buildTable(ctx,m,b);
    q=buildQuestionOfType(type,ctx,m,b,table); q.ctxId=ctx.id;
  }
  return q;
}

function makeChoices(correctText, distractors){
  const options=shuffle([{text:correctText,correct:true}, ...distractors.map(d=>({text:d,correct:false}))]);
  return options;
}

function buildQuestionOfType(type,ctx,m,b,table){
  const eqText=`y = ${m}x + ${b}`;
  if(type==='verbal2table'){
    const wrongY = table.map(p=>p.y);
    return {
      type, prompt:`${ctx.verb(m,b)}<br><br>Which table correctly represents this situation? (x = ${ctx.unitX}s, y = ${ctx.unitY})`,
      renderChoiceAsTable:true,
      choices: makeChoices(
        JSON.stringify(table),
        [
          JSON.stringify(buildTable(ctx,m,0)), // forgot the base
          JSON.stringify(buildTable(ctx,m+ (m>3?-2:2),b)), // wrong rate
          JSON.stringify(table.map(p=>({x:p.x,y:p.y+b}))) // double-added base
        ]
      ),
      explanation:`Since the base is ₱${b} and each ${ctx.unitX} adds ₱${m}, the correct values follow y = ${m}x + ${b}.`
    };
  }
  if(type==='table2graph'){
    return {
      type, prompt:`This table shows a linear relationship for "${ctx.label}":`,
      showTable:table,
      choices: makeChoices('correct-graph', ['flat-line','wrong-slope-graph','wrong-intercept-graph']),
      renderAsGraphChoice:true, m, b, ctx,
      explanation:`The correct graph has a y-intercept of ${b} and rises by ${m} for every 1 unit of x — matching y = ${m}x + ${b}.`
    };
  }
  if(type==='graph2equation'){
    return {
      type, prompt:`A line passes through (0, ${b}) and (1, ${b+m}). Which equation matches this graph?`,
      choices: makeChoices(eqText, [`y = ${b}x + ${m}`, `y = ${m}x - ${b}`, `y = ${m+b}x`]),
      explanation:`The y-intercept (${b}) is where x = 0, and the slope (${m}) is the constant rate of change — so y = ${m}x + ${b}.`
    };
  }
  if(type==='equation2meaning'){
    const askSlope = Math.random()<0.5;
    const prompt = askSlope
      ? `The equation for "${ctx.label}" is ${eqText}. What does <strong>${m}</strong> represent in this situation?`
      : `The equation for "${ctx.label}" is ${eqText}. What does <strong>${b}</strong> represent in this situation?`;
    const correct = askSlope ? `The rate: ₱${m} added per ${ctx.unitX}` : `The starting/base amount of ₱${b}`;
    const distractors = askSlope
      ? [`The starting/base amount of ₱${b}`, `The total ${ctx.unitY}`, `The number of ${ctx.unitX}s`]
      : [`The rate: ₱${m} added per ${ctx.unitX}`, `The total ${ctx.unitY}`, `The number of ${ctx.unitX}s`];
    return { type, prompt, choices: makeChoices(correct,distractors),
      explanation:`In y = mx + b, m is the constant rate of change and b is the starting value when x = 0.` };
  }
  // realworld2model — complete problem
  const targetX = randInt(4,9);
  const correctY = m*targetX+b;
  return {
    type, prompt:`${ctx.verb(m,b)}<br><br>How much would the total be for ${targetX} ${ctx.unitX}s?`,
    choices: makeChoices(`₱${correctY}`, [`₱${m*targetX}`, `₱${(m*targetX+b)+m}`, `₱${b*targetX}`]),
    explanation:`Substitute x = ${targetX} into y = ${m}x + ${b}: y = ${m}(${targetX}) + ${b} = ₱${correctY}.`
  };
}

/* ---------------- QUESTION RENDERING (shared by practice/quiz/unit test) ---------------- */
function renderQuestionCard(q, onAnswered){
  const wrap=el(`<div class="card"></div>`);
  wrap.innerHTML=`
    <div class="q-context">${(CONTEXTS.find(c=>c.id===q.ctxId)||{label:'Linear Relationship'}).label}</div>
    <div class="q-prompt">${q.prompt}</div>
    ${q.showTable?renderTableHtml(q.showTable):''}
    <div class="choices"></div>
    <div class="feedback-slot"></div>
  `;
  const choicesDiv=wrap.querySelector('.choices');
  q.choices.forEach((opt,idx)=>{
    let label = opt.text;
    if(q.renderChoiceAsTable){ label = renderTableHtml(JSON.parse(opt.text)); }
    else if(q.renderAsGraphChoice){ label = graphChoiceLabel(opt.text); }
    const btn=el(`<button class="choice">${label}</button>`);
    btn.onclick=()=>{
      [...choicesDiv.children].forEach(c=>c.setAttribute('disabled','true'));
      const correct=opt.correct;
      btn.classList.add(correct?'correct':'wrong');
      if(!correct){
        const correctBtn=[...choicesDiv.children][q.choices.findIndex(o=>o.correct)];
        correctBtn.classList.add('correct');
      }
      const fb=wrap.querySelector('.feedback-slot');
      fb.innerHTML=`<div class="feedback-box ${correct?'good':'bad'}">
        <strong>${correct? '🎉 Excellent!' : 'Not quite — here is why:'}</strong><br>${q.explanation}
        <div class="mt8"><button class="btn btn-sm btn-ghost" onclick="speak(this.parentElement.parentElement.parentElement.querySelector('.feedback-box').innerText)">🔊 Listen</button></div>
      </div>`;
      if(correct){ STATE.stats.correctLinearId++; if(STATE.stats.correctLinearId>=10) unlockAchievement('pattern_spotter'); saveState(); }
      onAnswered(correct);
    };
    choicesDiv.appendChild(btn);
  });
  return wrap;
}
function renderTableHtml(table){
  return `<table class="rep-table"><tr><th>x</th>${table.map(p=>`<td>${p.x}</td>`).join('')}</tr><tr><th>y</th>${table.map(p=>`<td>${p.y}</td>`).join('')}</tr></table>`;
}
function graphChoiceLabel(kind){
  const labels={
    'correct-graph':'📈 Graph A — line rises steadily from the correct starting point',
    'flat-line':'📉 Graph B — flat horizontal line (no rate of change)',
    'wrong-slope-graph':'📈 Graph C — line rises much faster than the data suggests',
    'wrong-intercept-graph':'📈 Graph D — line starts at zero, ignoring the base amount'
  };
  return labels[kind]||kind;
}

/* ---------------- SVG GRAPH ---------------- */
function svgGraph(m,b,ctx,size=240,highlightWrong=null){
  const W=size, H=size, pad=34;
  const xs=[0,1,2,3,4,5,6,7,8];
  const ys=xs.map(x=>m*x+b);
  const maxY=Math.max(...ys)*1.15;
  const maxX=Math.max(...xs);
  const sx=x=> pad + (x/maxX)*(W-2*pad);
  const sy=y=> H-pad - (y/maxY)*(H-2*pad);
  let path='';
  xs.forEach((x,i)=>{ path += (i===0?'M':'L') + sx(x)+','+sy(ys[i])+' '; });
  const dots = xs.filter((x,i)=>i%2===0).map((x,i2)=>{
    const y=m*x+b; return `<circle cx="${sx(x)}" cy="${sy(y)}" r="4" fill="#F472B6"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${size}">
    <line x1="${pad}" y1="${H-pad}" x2="${W-6}" y2="${H-pad}" stroke="#3A4A6B" stroke-width="2"/>
    <line x1="${pad}" y1="${H-pad}" x2="${pad}" y2="6" stroke="#3A4A6B" stroke-width="2"/>
    <path d="${path}" fill="none" stroke="#5EEAD4" stroke-width="3"/>
    ${dots}
    <text x="${W/2}" y="${H-6}" fill="#93A2C2" font-size="10" text-anchor="middle">${ctx?ctx.xLabel:'x'}</text>
    <text x="10" y="14" fill="#93A2C2" font-size="10">${ctx?ctx.yLabel:'y'}</text>
  </svg>`;
}

  if(!holder) return;
  // Try to use a CDN QR library if online; otherwise show a text fallback (no fake QR).
  if(window.QRCode){
    try{ new QRCode(holder, {text:payload, width:110, height:110}); return; }catch(e){}
  }
  if(navigator.onLine){
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload=()=>{ try{ new QRCode(holder, {text:payload, width:110, height:110}); }catch(e){ qrFallback(holder,payload); } };
    s.onerror=()=>qrFallback(holder,payload);

  } else {

  }
}

/* GAME 1: Match the Representation (memory flip) */
let matchState=null;
function startMatchGame(){
  const pairs=[];
  const usedCtx=shuffle(CONTEXTS).slice(0,4);
  usedCtx.forEach(ctx=>{
    const {m,b}=genLine();
    pairs.push({key:ctx.id, side:'situation', text:ctx.verb(m,b)});
    pairs.push({key:ctx.id, side:'equation', text:`y = ${m}x + ${b}`});
  });
  matchState={cards:shuffle(pairs).map((c,i)=>({...c,id:i,flipped:false,matched:false})), first:null, moves:0, matchedCount:0};
  renderMatchGame();
}
function renderMatchGame(){
  const {cards}=matchState;
  $('#viewport').innerHTML=`<div class="card">
    <div class="flex-between"><h3>🧩 Match the Representation</h3><span class="pill">Moves: ${matchState.moves}</span></div>
    <p class="small">Tap two cards to match a real-life situation with its equation.</p>
    <div class="grid grid-2 mt16" id="matchGrid" style="gap:10px;"></div>
  </div><div class="btn-row">${returnHomeBtn()}</div>`;
  const grid=$('#matchGrid');
  cards.forEach(c=>{
    const shown = c.flipped||c.matched;
    const b=el(`<button class="choice" style="min-height:70px;${c.matched?'opacity:.45;':''}">${shown?c.text:'❓ Tap to reveal'}</button>`);
    b.onclick=()=>flipMatchCard(c.id);
    if(c.matched) b.setAttribute('disabled','true');
    grid.appendChild(b);
  });
}
function flipMatchCard(id){
  const card=matchState.cards.find(c=>c.id===id);
  if(card.flipped||card.matched) return;
  card.flipped=true;
  if(matchState.first===null){ matchState.first=id; renderMatchGame(); return; }
  matchState.moves++;
  const first=matchState.cards.find(c=>c.id===matchState.first);
  if(first.key===card.key && first.side!==card.side){
    first.matched=true; card.matched=true; matchState.matchedCount++;
    matchState.first=null;
    renderMatchGame();
    if(matchState.matchedCount===4){ finishMatchGame(); }
  } else {
    renderMatchGame();
    setTimeout(()=>{ first.flipped=false; card.flipped=false; matchState.first=null; renderMatchGame(); },900);
  }
}
function finishMatchGame(){
  const xp=30, gems=8;
  addXp(xp); addGems(gems);
  STATE.gameResults.push({game:'match',moves:matchState.moves,date:Date.now()}); saveState();
  confettiBurst(50);
  $('#viewport').innerHTML=`<div class="card center"><h2>🎉 All Matched!</h2><p>Completed in ${matchState.moves} moves.</p>
  <p>⭐ +${xp} XP 💎 +${gems} Gems</p>
  <div class="btn-row" style="justify-content:center;"><button class="btn btn-primary" onclick="startMatchGame()">🔄 Play Again</button>${returnHomeBtn()}</div></div>`;
}

 {keys:['graph','plot','coordinate'],resp:"On a graph, the y-intercept is where the line crosses the y-axis, and the slope is how steep the line rises. Try plotting (0,b) first, then move right 1 and up m to get your second point."},
 {keys:['equation','y=mx','model'],resp:"A linear equation has the form y = mx + b. m is the slope, b is the intercept. If you know two points or a table, you can find m by seeing how much y changes per 1 unit of x."},
 {keys:['linear relationship','linear'],resp:"A relationship is linear when y changes by the same constant amount every time x increases by 1 — that constant is the slope."},
 {keys:['hint'],resp:"Here's a hint: look at what stays the same (that's usually b) and what changes steadily (that's usually m). Try re-reading the problem with that lens!"},
 {keys:['why is the answer','why b','why c','why d','why a'],resp:"Great question — let's reason it out together instead of me just telling you. What do you notice about the numbers in the correct choice compared to the problem?"}
];
function tutorReply(msg){
  const lower=msg.toLowerCase();
  for(const item of TUTOR_KB){
    if(item.keys.some(k=>lower.includes(k))) return item.resp;
  }
  return "I'm not completely sure what you mean yet 🤔. Try asking me about slope, y-intercept, tables, graphs, equations, or linear relationships!";
}
function toggleTutor(){
  const panel=$('#tutor-panel');
  panel.classList.toggle('hidden');
  if(!panel.classList.contains('hidden') && !panel.dataset.inited){
    panel.dataset.inited='1';
    addTutorMsg("Hi! I'm your Math Coach 🤖. Ask me about slope, intercepts, tables, graphs, or equations — I'll guide you with hints rather than just giving answers.",'bot');
    const quick=$('#tutorQuick');
    ['What is slope?','What is the y-intercept?','How do I make a table?','I am stuck'].forEach(q=>{
      const c=el(`<button class="qchip">${q}</button>`);
      c.onclick=()=>{ $('#tutorInput').value=q; sendTutorMsg(); };
      quick.appendChild(c);
    });
  }
}
function addTutorMsg(text,who){
  const m=el(`<div class="tmsg ${who}">${text}</div>`);
  $('#tutorMsgs').appendChild(m);
  $('#tutorMsgs').scrollTop=$('#tutorMsgs').scrollHeight;
}
function sendTutorMsg(){
  const input=$('#tutorInput');
  const msg=input.value.trim();
  if(!msg) return;
  addTutorMsg(escapeHtml(msg),'user');
  input.value='';
  setTimeout(()=>{
    const reply=tutorReply(msg);
    addTutorMsg(reply,'bot');
  },380);
}

/* ---------------- BOOT ---------------- */
function boot(){
  loadState();
  updateOfflineStatus();
  renderAvatarGrid();
  if(STATE.username) $('#usernameInput').value=STATE.username;
  if(STATE.started){
    $('#screen-landing').classList.add('hidden');
    $('#app').classList.remove('hidden');
    renderTopbar(); renderNav(); goHome();
  }
}
document.addEventListener('DOMContentLoaded',boot);
</script>
